name: build-psmdb-buildbarn-runners

# Builds the PSMDB BuildBarn runner images across three dimensions:
#   - 11 (distro, arch) pairs defined by IaC/buildbarn/runners/<name>/Dockerfile,
#     taken 1:1 from the parallel stages of
#     psmdb/jenkins/percona-server-for-mongodb-8.3.groovy (see
#     IaC/buildbarn/buildbarn-ondemand-scaler.md §3.1)
#   - 3 PSMDB release lines: 8.0, 8.3, master — each with its own
#     psmdb_builder_<version>.sh copy in IaC/buildbarn/runners/
#
# Total matrix: 11 × 3 = 33 jobs. Each pushes to
#   ghcr.io/<owner>/psmdb-buildbarn-runners/<runner>:<version>-<sha>   (immutable)
#   ghcr.io/<owner>/psmdb-buildbarn-runners/<runner>:<version>          (moving)
#
# Version tagging lets a single runner repo (e.g. ubuntu-noble-x86_64) carry
# one tag per PSMDB release line, so BuildBarn worker configs pin images by
# `container-image=ghcr.io/.../<runner>:<version>-<sha>` and we can route
# different PSMDB client builds to the right deps without duplicating repos.
#
# aarch64 images build natively on GitHub-hosted ARM runners
# (`ubuntu-24.04-arm`, free for public repos), avoiding 10-20x QEMU
# emulation overhead. If ARM runners become unavailable, swap
# runs_on: ubuntu-24.04-arm -> ubuntu-24.04 and add `docker/setup-qemu-action`
# — the Dockerfiles themselves are identical for both archs.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Subset of runners to build (space-separated; empty = all 11)"
        required: false
        default: ""
      versions:
        description: "Subset of PSMDB release lines to build (space-separated: 8.0 8.3 master; empty = all)"
        required: false
        default: ""
      push_moving:
        description: "Also push the :<version> moving tag (disable for isolated branch experiments)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - main
      - PSMDB-2034_buildbarn_setup
    paths:
      - "IaC/buildbarn/runners/**"
      - ".github/workflows/build-psmdb-buildbarn-runners.yml"
  schedule:
    # Weekly rebuild to pick up upstream CVE updates in base images and any
    # drift in psmdb_builder_<version>.sh install_deps() — Mondays 03:00 UTC.
    - cron: "0 3 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: psmdb-buildbarn-runners

jobs:
  build:
    name: ${{ matrix.runner }} (psmdb-${{ matrix.psmdb_version }})
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        # Cartesian product of psmdb_version × runner (3 × 11 = 33 combinations).
        # The `include` entries below add `platform` and `runs_on` fields to
        # each (version, runner) cell based on the runner name — they do NOT
        # introduce new combinations.
        psmdb_version:
          - "8.0"
          - "8.3"
          - "master"
        runner:
          - oraclelinux-8-x86_64
          - oraclelinux-8-aarch64
          - oraclelinux-9-x86_64
          - oraclelinux-9-aarch64
          - amazonlinux-2023-x86_64
          - amazonlinux-2023-aarch64
          - ubuntu-jammy-x86_64
          - ubuntu-jammy-aarch64
          - ubuntu-noble-x86_64
          - ubuntu-noble-aarch64
          - debian-bookworm-x86_64
        include:
          - runner: oraclelinux-8-x86_64
            platform: linux/amd64
            runs_on: ubuntu-24.04
          - runner: oraclelinux-8-aarch64
            platform: linux/arm64
            runs_on: ubuntu-24.04-arm
          - runner: oraclelinux-9-x86_64
            platform: linux/amd64
            runs_on: ubuntu-24.04
          - runner: oraclelinux-9-aarch64
            platform: linux/arm64
            runs_on: ubuntu-24.04-arm
          - runner: amazonlinux-2023-x86_64
            platform: linux/amd64
            runs_on: ubuntu-24.04
          - runner: amazonlinux-2023-aarch64
            platform: linux/arm64
            runs_on: ubuntu-24.04-arm
          - runner: ubuntu-jammy-x86_64
            platform: linux/amd64
            runs_on: ubuntu-24.04
          - runner: ubuntu-jammy-aarch64
            platform: linux/arm64
            runs_on: ubuntu-24.04-arm
          - runner: ubuntu-noble-x86_64
            platform: linux/amd64
            runs_on: ubuntu-24.04
          - runner: ubuntu-noble-aarch64
            platform: linux/arm64
            runs_on: ubuntu-24.04-arm
          - runner: debian-bookworm-x86_64
            platform: linux/amd64
            runs_on: ubuntu-24.04

    steps:
      - name: Skip if variant or version filtered out
        id: filter
        shell: bash
        env:
          VARIANTS_FILTER: ${{ github.event.inputs.variants }}
          VERSIONS_FILTER: ${{ github.event.inputs.versions }}
          THIS_RUNNER: ${{ matrix.runner }}
          THIS_VERSION: ${{ matrix.psmdb_version }}
        run: |
          # Variant filter (runner name)
          if [[ -n "${VARIANTS_FILTER}" ]]; then
            hit="false"
            for v in ${VARIANTS_FILTER}; do
              if [[ "${v}" == "${THIS_RUNNER}" ]]; then hit="true"; break; fi
            done
            if [[ "${hit}" == "false" ]]; then
              echo "runner ${THIS_RUNNER} not in variants filter [${VARIANTS_FILTER}], skipping"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Version filter (psmdb_version)
          if [[ -n "${VERSIONS_FILTER}" ]]; then
            hit="false"
            for v in ${VERSIONS_FILTER}; do
              if [[ "${v}" == "${THIS_VERSION}" ]]; then hit="true"; break; fi
            done
            if [[ "${hit}" == "false" ]]; then
              echo "version ${THIS_VERSION} not in versions filter [${VERSIONS_FILTER}], skipping"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.filter.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.filter.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.filter.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        if: steps.filter.outputs.run == 'true'
        id: meta
        shell: bash
        env:
          PSMDB_VERSION: ${{ matrix.psmdb_version }}
        run: |
          # GHCR paths must be lowercase; repo owners like "Percona" would
          # otherwise cause 400 at push time.
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAMESPACE}/${{ matrix.runner }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "cache_bust=$(date +%s)" >> "$GITHUB_OUTPUT"

          # Normalize version to a filename-safe slug for the script path:
          #   "8.0"    -> "8_0"    -> psmdb_builder_8_0.sh
          #   "8.3"    -> "8_3"    -> psmdb_builder_8_3.sh
          #   "master" -> "master" -> psmdb_builder_master.sh
          SLUG="${PSMDB_VERSION//./_}"
          SCRIPT_PATH="IaC/buildbarn/runners/psmdb_builder_${SLUG}.sh"
          echo "script_path=${SCRIPT_PATH}" >> "$GITHUB_OUTPUT"

          # Tag set:
          #   :<version>-<sha> — immutable, for production worker pinning
          #   :<version>       — moving alias, for dev iteration (default on)
          # Disable the moving tag with push_moving=false for isolated branch
          # experiments that must not overwrite the current :<version> pointer.
          TAGS="${IMAGE}:${PSMDB_VERSION}-${{ github.sha }}"
          PUSH_MOVING="${{ github.event.inputs.push_moving }}"
          if [[ -z "${PUSH_MOVING}" || "${PUSH_MOVING}" == "true" ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:${PSMDB_VERSION}"
          fi
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.runner }} (psmdb-${{ matrix.psmdb_version }})
        if: steps.filter.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: IaC/buildbarn/runners/${{ matrix.runner }}
          file: IaC/buildbarn/runners/${{ matrix.runner }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            JENKINS_PIPELINES_REPO=https://github.com/${{ github.repository }}.git
            JENKINS_PIPELINES_BRANCH=${{ github.ref_name }}
            PSMDB_VERSION=${{ matrix.psmdb_version }}
            PSMDB_BUILDER_SCRIPT_PATH=${{ steps.meta.outputs.script_path }}
            CACHE_BUST=${{ steps.meta.outputs.cache_bust }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.percona.psmdb.version=${{ matrix.psmdb_version }}

      - name: Summarize
        if: steps.filter.outputs.run == 'true'
        shell: bash
        run: |
          {
            echo "### ${{ matrix.runner }} — psmdb-${{ matrix.psmdb_version }} (${{ matrix.platform }})"
            echo ""
            echo "Script: \`${{ steps.meta.outputs.script_path }}\`"
            echo ""
            echo "Pushed tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pull:"
            echo '```bash'
            echo "docker pull ${{ steps.meta.outputs.image }}:${{ matrix.psmdb_version }}-${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Aggregate job surfaces a single "all green" status check suitable for
  # branch protection; avoids requiring 33 separate checks to stay in sync.
  report:
    name: report
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check matrix result
        shell: bash
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "build matrix result: ${RESULT}"
          if [[ "${RESULT}" != "success" ]]; then
            echo "one or more variant/version combinations failed"
            exit 1
          fi
