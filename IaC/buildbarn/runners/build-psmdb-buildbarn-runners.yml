- job:
    name: hetzner-psmdb-buildbarn-runners
    project-type: pipeline
    description: |
        Builds PSMDB BuildBarn runner container images and pushes them to
        a single Docker Hub repository docker.io/perconalab/psmdb-rbe with
        a tag-based (distro × version × arch) matrix:
          :<distro>-<version>-<sha>           (immutable, multi-arch)
          :<distro>-<version>                 (moving alias)
          :<distro>-<version>-<sha>-<arch>    (per-arch leaf)

        Mirrors the GHA workflow .github/workflows/build-psmdb-buildbarn-runners.yml
        but targets Docker Hub so upstream PSMDB-2034 reviewers can pull the
        images without GHCR credentials.

        Topology: two parallel arch legs ("amd64 leg" on docker-x64,
        "arm64 leg" on docker-aarch64), each running the full
        (distro × version) sub-matrix sequentially on its single node.
        Pinning each arch to one node avoids stalling 18 simultaneous
        ARM nodes from Hetzner while still keeping amd64 ‖ arm64.

        Manifest list stitching happens in the final stage on docker-x64.

        Do not edit this job through the web!
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/vorsel/jenkins-pipelines.git
            branches:
            - 'hetzner'
            wipe-workspace: false
      lightweight-checkout: true
      script-path: IaC/buildbarn/runners/build-psmdb-buildbarn-runners.groovy
