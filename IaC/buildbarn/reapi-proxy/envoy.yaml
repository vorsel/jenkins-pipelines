# PSMDB-2034: enable Envoy admin endpoint for runtime stats / circuit-breaker
# observability.
#
# IMPORTANT: bind 0.0.0.0 INSIDE the container, not 127.0.0.1.
# Docker port mapping `127.0.0.1:9901:9901` (see docker-compose.yml) forwards
# packets from the host's loopback into the container's *bridge* interface
# (eth0, 172.x.x.x), NOT the container's loopback. If Envoy listens only on
# the container's lo, those packets land on eth0 with no listener and the
# connection silently drops — `curl localhost:9901/...` returns empty
# without an error. Listening on 0.0.0.0 inside the container is safe
# because the host-side port binding (127.0.0.1:9901, NOT 0.0.0.0:9901) is
# what enforces "loopback-only on the host" — public NICs never see this
# port from outside.
#
# Useful queries during/after a multi-stage Bazel run:
#   curl -s localhost:9901/clusters | grep -E "circuit_breakers|cx_overflow|rq_overflow|rq_pending_overflow"
#   curl -s 'localhost:9901/stats?filter=upstream_cx_active'
#   curl -s 'localhost:9901/stats?filter=upstream_rq_pending_active'
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: grpc_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8981
    # PSMDB-2034: TLS-handshake resilience under burst load.
    #
    # The default Linux SOMAXCONN-derived TCP listen backlog (128 on
    # Debian 13's net.core.somaxconn = 4096 — yes, kernel default is
    # 4096, but listen() in C stdlib still passes 128 unless we ask
    # for more) saturates instantly during a Jenkins matrix burst:
    # ~11 stages × ~72 jobs/stage × 3 channels (executor + cache + BES)
    # = ~2300 simultaneous TCP SYNs. Anything that arrives after the
    # backlog is full gets a SYN drop; the client retries with
    # exponential backoff, but Bazel's grpc-java has a 10s
    # SslHandshakeTimeoutException ceiling and bails before the retry
    # cycle catches up.
    #
    # Three-pronged fix:
    #   1. tcp_backlog_size — explicit listen(2) backlog ceiling.
    #      Envoy passes this to socket(2)/listen(2); kernel still
    #      caps at net.core.somaxconn (which we set to 65535 in
    #      bootstrap_host's sysctl tuning), so 4096 here is honoured
    #      end-to-end.
    #   2. reuse_port=true — the listener opens N sockets bound with
    #      SO_REUSEPORT and the kernel hashes incoming SYNs across
    #      them, one per Envoy worker thread. Without this, a single
    #      socket fans out to all workers via a userspace mutex,
    #      which is the actual TLS-handshake bottleneck under burst
    #      load on multi-core boxes.
    #   3. connection_balance_config: exact_balance — when reuse_port
    #      is on, this rebalances accepted connections across workers
    #      so a momentarily-busy worker doesn't starve while a peer
    #      sits idle. Cheap; comparable to nginx's least_conn.
    tcp_backlog_size: 4096
    reuse_port: true
    connection_balance_config:
      exact_balance: {}
    filter_chains:
    # TLS termination for Bazel clients reaching the cluster from the
    # public internet. Cert is the Let's Encrypt cert for
    # bb-psmdb.ddns.net (No-IP free DDNS, A-record on the central VM's
    # Hetzner Floating IP). Cert files are deploy-copied (resolved
    # symlinks, mode 0644) from /etc/letsencrypt/live/<host>/ into
    # /var/lib/buildbarn/certs/ on the host by the certbot deploy-hook
    # at /etc/letsencrypt/renewal-hooks/deploy/10-buildbarn.sh, and that
    # directory is mounted into this container at /etc/buildbarn/certs.
    # The hook also restarts this envoy service after each renewal.
    # Frontend and reapi-proxy behind Envoy stay plaintext on the docker
    # bridge — they are not reachable from outside the central VM.
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            alpn_protocols: [h2]
            tls_certificates:
            - certificate_chain:
                filename: /etc/buildbarn/certs/fullchain.pem
              private_key:
                filename: /etc/buildbarn/certs/privkey.pem
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: reapi_proxy
          codec_type: AUTO
          http2_protocol_options:
            max_concurrent_streams: 1000
            initial_stream_window_size: 1048576
            initial_connection_window_size: 1048576
          route_config:
            name: local_route
            virtual_hosts:
            - name: reapi
              domains: ["*"]
              routes:
              # Capabilities requests -> patching proxy
              - match:
                  prefix: "/build.bazel.remote.execution.v2.Capabilities/"
                route:
                  cluster: capabilities_proxy
                  timeout: 30s
              # Everything else -> BuildBarn frontend directly
              - match:
                  prefix: "/"
                route:
                  cluster: buildbarn_frontend
                  timeout: 3600s
                  max_stream_duration:
                    grpc_timeout_header_max: 3600s
          http_filters:
          # Step 5 — JWT authentication for Bazel clients.
          # Order matters: jwt_authn MUST come before the router so
          # that an Authorization: Bearer header is verified against
          # Dex's JWKS BEFORE Envoy forwards the RPC to the upstream
          # cluster (capabilities_proxy or buildbarn_frontend).
          # A request without a valid bearer is rejected at this
          # filter with HTTP 401 and never touches BB.
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                # Dex is the sole issuer at this stage. id_tokens minted
                # for Bazel-side clients carry:
                #   iss = https://bb-psmdb.ddns.net:5556
                #   aud = ["bazel-cli"]      (Device Code flow — humans)
                #   aud = ["bazel-jenkins"]  (Token Exchange flow — CI;
                #                             see dex.yaml `bazel-jenkins`
                #                             staticClient and the
                #                             `jenkins-percona` connector)
                # We pin BOTH so that a Dex token meant for bb-browser
                # or bb-scheduler-admin (different `aud`) cannot be
                # replayed against the gRPC endpoint — a defense-in-
                # depth against the not-actually-bad-but-let's-not-
                # confuse-them scenario where someone copy-pastes
                # their browser session cookie's id_token here.
                #
                # Jenkins-issued OIDC tokens (iss = .../psmdb.cd...
                # /oidc, aud = ["psmdb-rbe"]) are NEVER accepted here;
                # they only exist for the one-shot exchange at Dex's
                # /token. Trust universe stays single-rooted on Dex.
                dex_provider:
                  issuer: https://bb-psmdb.ddns.net:5556
                  audiences:
                  - bazel-cli
                  - bazel-jenkins
                  # Refresh the JWKS in the background every 60s.
                  #
                  # Dex rotates signing keys every 6h and keeps the
                  # past 24h of public keys in `/keys`, so any kid
                  # that was active in the last day is still valid
                  # for verification. The narrow failure mode is the
                  # window between (a) Dex rotating to kid_v2 and
                  # (b) Envoy refreshing its cached JWKS — during
                  # that window Bazel sends a token signed by kid_v2
                  # that Envoy doesn't yet know, and the request
                  # gets HTTP 401 ("Jwks doesn't have key to match
                  # kid"). PSMDB-2034 build #15 hit this exactly
                  # 2m22s after Dex rotated at 00:22:32 UTC, with
                  # Envoy's then-cached JWKS taken pre-rotation.
                  #
                  # Width of that window is `cache_duration`. With
                  # 600s (10m) the failure probability per build was
                  # 600/21600 ≈ 2.8% (one in 36). With 60s we drop
                  # to ~0.28%, AND Bazel's --remote_retries=5 with
                  # --remote_retry_max_delay=30s yields a cumulative
                  # backoff of ~60s — comfortably enough for Envoy
                  # to refresh JWKS during the retry window and
                  # mask the failure entirely on the client side.
                  # Cost: 1 GET /keys per minute against the local
                  # Dex container, negligible.
                  remote_jwks:
                    http_uri:
                      uri: https://bb-psmdb.ddns.net:5556/keys
                      cluster: dex_jwks
                      timeout: 5s
                    cache_duration: 60s
                  # `forward: true` keeps the Authorization header
                  # attached when Envoy forwards to BB. We don't
                  # actually consume it on the BB side today (BB
                  # frontend stays `allow{}` on the docker bridge,
                  # see "BB-side note" in the plan), but leaving it
                  # in lets us turn on BB-level JWT validation as
                  # defense-in-depth later without re-shipping
                  # Envoy.
                  forward: true
                  from_headers:
                  - name: authorization
                    value_prefix: "Bearer "
              rules:
              # All RPCs require a valid token — no public path. The
              # /build.bazel.remote.execution.v2.Capabilities/ split
              # in the route_config above is purely an upstream-
              # selection question; both the Capabilities and the
              # Execution streams need auth.
              - match:
                  prefix: /
                requires:
                  provider_name: dex_provider
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # bb-portal — Build Event Stream (BES) gRPC listener.
  #
  # Bazel clients publish their BES events to grpcs://<host>:1985 with the
  # same Authorization: Bearer <jwt> header that wrapper_hook.py already
  # injects for --remote_executor. Envoy terminates TLS here, validates
  # the JWT against Dex via the same `dex_provider` config used on :8981,
  # and forwards plaintext gRPC to bb-portal-backend:8082 (which has
  # `authenticationPolicy: { allow: {} }` on its BES gRPC server — see
  # plan §"Step 1 → Decision B" for the rationale of validating once at
  # the gateway rather than re-implementing JWKS fetch in bb-portal).
  #
  # `dex_provider` config is duplicated (rather than aliased from the
  # :8981 listener) because Envoy's JwtAuthentication filter scopes
  # `providers:` to the filter instance — there is no global provider
  # registry. The two copies MUST stay in lockstep; if you bump
  # `cache_duration` or change the audience here, do the same on
  # :8981's filter or BES auth will diverge from execution auth.
  - name: bes_grpc_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 1985
    # Same resilience knobs as grpc_listener above — see that block for
    # the full burst-load rationale. BES streams open at the same instant
    # as the executor/cache channels (`--bes_backend=…` is honoured for
    # the duration of the build), so this listener takes the same SYN
    # spike at burst start.
    tcp_backlog_size: 4096
    reuse_port: true
    connection_balance_config:
      exact_balance: {}
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            alpn_protocols: [h2]
            tls_certificates:
            - certificate_chain:
                filename: /etc/buildbarn/certs/fullchain.pem
              private_key:
                filename: /etc/buildbarn/certs/privkey.pem
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: bes_proxy
          codec_type: AUTO
          http2_protocol_options:
            max_concurrent_streams: 1000
            initial_stream_window_size: 1048576
            initial_connection_window_size: 1048576
          # BES is bidirectional-streaming: PublishBuildToolEventStream
          # stays open for the full duration of a Bazel build (minutes
          # to hours on full-matrix PSMDB CI). Default Envoy stream-idle
          # / request timeouts would slam the connection mid-build and
          # make Bazel resend events from scratch. Disable both.
          stream_idle_timeout: 0s
          request_timeout: 0s
          route_config:
            name: bes_route
            virtual_hosts:
            - name: bes
              domains: ["*"]
              routes:
              # Match-all: this listener only serves BES traffic, so we
              # don't bother with a path-prefix sieve. The actual gRPC
              # service path (`/google.devtools.build.v1.PublishBuildEvent/…`)
              # gets forwarded as-is to bb-portal-backend.
              - match:
                  prefix: "/"
                route:
                  cluster: bb_portal_bes
                  # Same 0s timeout reasoning as above.
                  timeout: 0s
                  max_stream_duration:
                    grpc_timeout_header_max: 0s
          http_filters:
          # JWT authentication — must precede the router so Envoy
          # short-circuits anonymous traffic before the bb-portal-backend
          # cluster ever sees it. Lockstep with the :8981 filter — see
          # block comment above.
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                dex_provider:
                  issuer: https://bb-psmdb.ddns.net:5556
                  audiences:
                  - bazel-cli
                  - bazel-jenkins
                  # cache_duration: 60s — see grpc_listener block for
                  # full rationale (Dex rotation vs JWKS cache window).
                  remote_jwks:
                    http_uri:
                      uri: https://bb-psmdb.ddns.net:5556/keys
                      cluster: dex_jwks
                      timeout: 5s
                    cache_duration: 60s
                  forward: true
                  from_headers:
                  - name: authorization
                    value_prefix: "Bearer "
              rules:
              - match:
                  prefix: /
                requires:
                  provider_name: dex_provider
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: capabilities_proxy
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    # PSMDB-2034: same thresholds as buildbarn_frontend — see comment there.
    # Capabilities() is a one-call-per-invocation handshake, so the absolute
    # rate is way lower, but parallel matrix runs can still trigger 17
    # simultaneous /Capabilities/ RPCs which is well within defaults; we
    # bump anyway for symmetry with the other clusters.
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 100000
        max_pending_requests: 100000
        max_requests: 100000
        max_retries: 1000
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: capabilities_proxy
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: reapi-proxy
                port_value: 8990

  - name: buildbarn_frontend
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    # PSMDB-2034: lift Envoy default circuit-breaker thresholds.
    # Defaults are 1024 across the board (max_connections,
    # max_pending_requests, max_requests) and get overflowed by parallel
    # PSMDB Jenkins matrix builds: each invocation runs --jobs=72-190
    # (psmdb_buildfarm config), and the matrix can run up to 17 stages in
    # parallel against this cluster. 17 * 72 ≈ 1224 simultaneous
    # findMissingBlobs/getActionResult/etc. RPCs vs 1024-default →
    # `UNAVAILABLE: ... reset reason: overflow` mid-build (BB community
    # ref: buildbarn-deployments PR#187 "Bazel client overload"). Setting
    # high ceilings is safe because bb-storage already has its own
    # admission/queue management — Envoy is just a perimeter, not the
    # bottleneck. Watch via `curl localhost:9901/clusters | grep overflow`.
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 100000
        max_pending_requests: 100000
        max_requests: 100000
        max_retries: 1000
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            max_concurrent_streams: 1000
    load_assignment:
      cluster_name: buildbarn_frontend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: frontend
                port_value: 8980

  # Step 5 — upstream cluster the jwt_authn filter uses to fetch
  # Dex's public signing keys. We connect via the docker network alias
  # `bb-psmdb.ddns.net` (added on the dex service in docker-compose.yml
  # for the Step 4 OIDC token exchange) so traffic stays on the bridge
  # rather than hairpinning out through the floating IP. SNI matches
  # the cert SAN, so the upstream TLS handshake validates cleanly
  # against the system CA bundle (Let's Encrypt R10/R11 is in there).
  - name: dex_jwks
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: dex_jwks
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: bb-psmdb.ddns.net
                port_value: 5556
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: bb-psmdb.ddns.net
        common_tls_context:
          validation_context:
            trusted_ca:
              filename: /etc/ssl/certs/ca-certificates.crt
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher:
                exact: bb-psmdb.ddns.net

  # bb-portal-backend BES gRPC ingest — terminates the :1985 listener.
  # Plain HTTP/2 over the docker bridge (no TLS, no auth at this hop —
  # bb-portal-backend's BES gRPC server is configured `allow: {}` in
  # bb-portal.jsonnet because Envoy already validated the JWT). The
  # service name `bb-portal-backend` resolves via docker DNS on the
  # default bridge network.
  - name: bb_portal_bes
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    # PSMDB-2034: BES streams stay open for the lifetime of the Bazel
    # invocation (minutes to hours). 17 parallel stages → 17 long-lived
    # bidirectional streams plus burstier batch event publishes; same
    # 100k ceiling reasoning as buildbarn_frontend. Without this the BES
    # listener on :1985 also overflows under matrix load.
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 100000
        max_pending_requests: 100000
        max_requests: 100000
        max_retries: 1000
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            max_concurrent_streams: 1000
    load_assignment:
      cluster_name: bb_portal_bes
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: bb-portal-backend
                port_value: 8082
