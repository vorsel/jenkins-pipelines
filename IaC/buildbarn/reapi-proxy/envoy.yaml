static_resources:
  listeners:
  - name: grpc_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8981
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: reapi_proxy
          codec_type: AUTO
          http2_protocol_options:
            max_concurrent_streams: 1000
            initial_stream_window_size: 1048576
            initial_connection_window_size: 1048576
          route_config:
            name: local_route
            virtual_hosts:
            - name: reapi
              domains: ["*"]
              routes:
              # Capabilities requests -> patching proxy
              - match:
                  prefix: "/build.bazel.remote.execution.v2.Capabilities/"
                route:
                  cluster: capabilities_proxy
                  timeout: 30s
              # Everything else -> BuildBarn frontend directly
              - match:
                  prefix: "/"
                route:
                  cluster: buildbarn_frontend
                  timeout: 3600s
                  max_stream_duration:
                    grpc_timeout_header_max: 3600s
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: capabilities_proxy
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: capabilities_proxy
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: reapi-proxy
                port_value: 8990

  - name: buildbarn_frontend
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            max_concurrent_streams: 1000
    load_assignment:
      cluster_name: buildbarn_frontend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: frontend
                port_value: 8980
