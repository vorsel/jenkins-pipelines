# Declarative pool config consumed by the scaler daemon and by
# create-central.sh (which generates config/predeclared.libsonnet from this
# file at bake time — see bake_predeclared() in scripts/create-central.sh).
#
# Every pool is matched to a scheduler platform queue by its
# `container_image_sha`, which MUST equal what PSMDB's Bazel client sets in
# bazel/platforms/remote_execution_containers.bzl for that OS. When the
# scheduler reports that queue has queued operations but no workers, the
# scaler spawns a Hetzner VM from this pool's template.
#
# Source of truth for SHAs:
# -------------------------
# We mirror the upstream PSMDB master branch's
# `bazel/platforms/remote_execution_containers.bzl` as of Apr 2026.
# Mapping from our pool name → bzl entry:
#
#   ubuntu-noble-x86_64      → ubuntu24
#   ubuntu-jammy-x86_64      → ubuntu22
#   debian-bookworm-x86_64   → debian12
#   oraclelinux-8-x86_64     → rhel8  (OL8 is binary-compatible with RHEL8)
#   oraclelinux-9-x86_64     → rhel9  (OL9 is binary-compatible with RHEL9)
#   amazonlinux-2023-x86_64  → amazon_linux_2023
#
# Re-sync whenever PSMDB rebases to a fresher master: paste the new
# `.bzl` into a scratch file and run
#     awk -F'"' '/sha256:/{gsub(/.*sha256:/,"");gsub(/".*/,""); print}' \
#         scratch.bzl
# to get the list of SHAs, then update the pools below that changed.
#
# Priming a pool that upstream has NOT yet added (or one we got wrong):
#   1. Set `container_image_sha: null` below and redeploy — scaffolds the
#      pool but NO predeclared queue is emitted (null is skipped by the
#      auto-gen in create-central.sh).
#   2. Trigger a Bazel build against that OS. Because no predeclared queue
#      exists yet and the scaler can't route a pool without a SHA, Bazel
#      will fail with `FAILED_PRECONDITION: No workers exist ... platform
#      {"properties":[...,{"name":"container-image","value":"docker://...
#      @sha256:XYZ"}...]}`. That SHA is ground truth — paste it into
#      `container_image_sha` for this pool.
#   3. Redeploy. Predeclared queue now exists; subsequent builds route
#      normally and the scaler spawns workers on demand.
#
# All pool-level placeholders in worker/config/{common,worker,runner}.jsonnet
# and worker/docker-compose.yml are substituted by the scaler at spawn time —
# see scaler/bootstrap.py:render_user_data() for the exact mapping.

global:
  # Scheduler endpoints the scaler itself talks to.
  scheduler_state_grpc: 127.0.0.1:8984   # BuildQueueState (scaler reads)
  scheduler_public_url: null             # filled by create-central.sh (used for worker's browserUrl)
  scheduler_private_ip: null             # filled by create-central.sh (workers dial this for gRPC)

  # Hetzner project-wide defaults that every pool inherits.
  #
  # `hcloud_ssh_key_ids` — numeric ids of named SSH keys uploaded to
  # Hetzner. Every id listed here gets its pubkey injected into the
  # new worker's /root/.ssh/authorized_keys at VM-create time (Hetzner
  # has no API to add SSH keys AFTER creation, so the list is fixed
  # per-VM-lifecycle).
  #
  # An additional id is auto-appended at bake time by
  # scripts/create-central.sh:sync_configs → python yaml round-trip:
  # the numeric id of the Hetzner named key `bb-psmdb-ondemand-central`,
  # which carries the central's own /root/.ssh/id_ed25519.pub. This is
  # what lets the central ssh into workers over the private network
  # (required once we drop public IPs from workers).
  hcloud_ssh_key_ids:
    - 24333399         # htz.cd.key — operator's daily-driver key
    - 111196538        # htz.cd.bb-psmdb-ondemand — per-fleet key
    # bb-psmdb-ondemand-central id is APPENDED here at bake time.
  hcloud_network_id: 11374636            # psmdb.cd.percona.com private net
  hcloud_os_image: debian-13             # host OS for workers; decoupled from runner distro

  # Region try-chain. hel1 first because the central lives there → lowest
  # intra-AZ latency between workers and CAS. nbg1/fsn1 are fallbacks for
  # capacity errors during EU peak (same pattern as htz.cloud.groovy).
  region_try_chain: [hel1, nbg1, fsn1]

  # Safety rails. The scaler REFUSES any action that would exceed these.
  # 60 = 6 x86_64 pools × 5 max nodes each + headroom. Revisit if we move
  # to bigger machines or add aarch64 pools (adds 5 more × 5 = 25 more).
  max_total_nodes: 60                    # cap across all pools combined
  max_cost_per_hour_eur: 2.0             # sum of current VM hourly rates

  # Control loop timings.
  poll_interval_seconds: 30              # how often the scaler polls BuildQueueState
  scale_down_idle_seconds: 600           # 10 min — matches Hetzner per-hour billing granularity
  scale_up_threshold: 1                  # minimum queued ops before we spawn; desired-fleet math (ceil((queued+executing)/concurrency)) runs only once this floor is crossed

# Pools. Each key becomes the Hetzner label `psmdb.pool=<key>` on spawned VMs.
#
# Current coverage: 6 x86_64 variants. aarch64 pools (amazonlinux-2023,
# oraclelinux-{8,9}, ubuntu-{jammy,noble}) are NOT scaffolded here yet —
# they need Hetzner CAX server types, arm64 runner images verified against
# our cloud-init, and arm64 host Debian image. Tracked as follow-up;
# structure here is intentionally arch-symmetric so adding them is a
# straight copy/paste with s/cpx42/cax41/ and s/x86_64/aarch64/ per pool.
pools:

  # --------------------------------------------------------------------------
  # ubuntu24 (bzl key) → ubuntu-noble-x86_64.
  # Historical note: SHA f1bd9610…c10002 was captured from a real Bazel
  # FAILED_PRECONDITION error log against a week-old PSMDB master tree
  # during Phase-2 cold-start testing — all recorded cold-start smokes
  # (see ../../README.md §Cold-start race) were run against that SHA.
  # The live value below tracks today's upstream master and will NOT
  # match a Bazel client still pointing at the week-old tree.
  # --------------------------------------------------------------------------
  ubuntu-noble-x86_64:
    container_image_sha: "11c4f6d4848e0b1f44ab1d16f1c1b08555cbbad658579367e53b22b9540b987a"

    # Bazel platform property `Pool`. In PSMDB's .bazelrc this is set to the
    # architecture (not the OS) — all x86_64 variants share Pool=x86_64 and
    # are disambiguated at the scheduler by `container-image`. Keep this
    # explicit per-pool so an operator adding an aarch64 pool doesn't
    # inherit the wrong value.
    bazel_pool_value: x86_64

    # PSMDB release line this pool's runner image is built for. Tag
    # suffix on runner_image_base. 8.3 is the actively tested line in
    # Phase 2; 8.0 and master can be added by spinning up a second pool
    # with a different runner_image_base tag once their runner images
    # go through the same smoke.
    psmdb_version: "8.3"

    # Runner image reference — anonymous pull from ghcr.io as long as the
    # package visibility stays public (see worker/docker-compose.yml).
    runner_image_base: "ghcr.io/vorsel/psmdb-buildbarn-runners/ubuntu-noble-x86_64"

    # Hetzner VM geometry. cpx42 matches the central (8c/16GB/320GB) —
    # plenty of headroom for concurrency=12 and ~100 GB hardlinking cache.
    # Upgrade to cpx52 (12c/24GB) once we trust the setup and want more
    # throughput.
    server_type: cpx42
    concurrency: 12                      # must match worker.jsonnet's runners[0].concurrency

    # Per-pool caps. max_nodes sets the ceiling for THIS pool alone;
    # global.max_total_nodes is the hard ceiling across pools.
    #
    # min_nodes=0: no warm VM. The FAILED_PRECONDITION race that used to
    # force a warm node here is now handled at the scheduler level via
    # `predeclaredPlatformQueues` in compose/config/scheduler.jsonnet —
    # the queue exists at scheduler boot, actions wait for a worker instead
    # of failing. First-build latency is ~2 min (cold VM boot); subsequent
    # builds reuse the warm VM until it ages out via scale_down_idle_seconds.
    min_nodes: 0
    max_nodes: 5

  # --------------------------------------------------------------------------
  # Pools below inherit SHAs straight from upstream PSMDB master's
  # remote_execution_containers.bzl. First-time activation doesn't need
  # the priming-flow dance — the predeclared queue comes up on the next
  # redeploy. If a build still hits FAILED_PRECONDITION it means either:
  #
  #   (a) upstream bumped the image since we last synced (re-paste the
  #       new SHA here, redeploy);
  #   (b) the user is on a branch where PSMDB pinned the `.bzl` at a
  #       different revision — in which case flip this pool to
  #       `container_image_sha: null` and use the priming flow to capture
  #       the branch-specific SHA; file a TODO to reconcile.
  # --------------------------------------------------------------------------

  # ubuntu22 (bzl) → ubuntu-jammy-x86_64.
  ubuntu-jammy-x86_64:
    container_image_sha: "e9ef6a7caea4cf5c4858ebe54fc743163aaa58b1a6e55e970851abf85841424e"
    bazel_pool_value: x86_64
    psmdb_version: "8.3"
    runner_image_base: "ghcr.io/vorsel/psmdb-buildbarn-runners/ubuntu-jammy-x86_64"
    server_type: cpx42
    concurrency: 12
    min_nodes: 0
    max_nodes: 5

  # debian12 (bzl) → debian-bookworm-x86_64.
  debian-bookworm-x86_64:
    container_image_sha: "24d21b038c38fa4bea9cef8913f62756b7df1faa8a893306f42fcb934b957504"
    bazel_pool_value: x86_64
    psmdb_version: "8.3"
    runner_image_base: "ghcr.io/vorsel/psmdb-buildbarn-runners/debian-bookworm-x86_64"
    server_type: cpx42
    concurrency: 12
    min_nodes: 0
    max_nodes: 5

  # rhel8 (bzl) → oraclelinux-8-x86_64. OL8 is binary-compatible with
  # RHEL8, so the RHEL8 container image is the one Bazel tags actions
  # with when building for OL8.
  oraclelinux-8-x86_64:
    container_image_sha: "a628a8b69f286232dd94b3646055b31a4afb29876af075c1cbf078f0b36cf882"
    bazel_pool_value: x86_64
    psmdb_version: "8.3"
    runner_image_base: "ghcr.io/vorsel/psmdb-buildbarn-runners/oraclelinux-8-x86_64"
    server_type: cpx42
    concurrency: 12
    min_nodes: 0
    max_nodes: 5

  # rhel9 (bzl) → oraclelinux-9-x86_64 (same rationale as OL8/RHEL8).
  oraclelinux-9-x86_64:
    container_image_sha: "94db357316d2d3ea32751a197378c7dbbf825f5afd470e46ba27fdd107a5427f"
    bazel_pool_value: x86_64
    psmdb_version: "8.3"
    runner_image_base: "ghcr.io/vorsel/psmdb-buildbarn-runners/oraclelinux-9-x86_64"
    server_type: cpx42
    concurrency: 12
    min_nodes: 0
    max_nodes: 5

  # amazon_linux_2023 (bzl) → amazonlinux-2023-x86_64.
  amazonlinux-2023-x86_64:
    container_image_sha: "e6080195e7c253f8013317c51ad5ae0fa3e593c77a8cf30390d7c4f4cf8395f3"
    bazel_pool_value: x86_64
    psmdb_version: "8.3"
    runner_image_base: "ghcr.io/vorsel/psmdb-buildbarn-runners/amazonlinux-2023-x86_64"
    server_type: cpx42
    concurrency: 12
    min_nodes: 0
    max_nodes: 5
