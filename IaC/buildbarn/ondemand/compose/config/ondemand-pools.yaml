# Declarative pool config consumed by the scaler daemon and by
# create-central.sh (which generates config/predeclared.libsonnet from this
# file at bake time — see bake_env() in scripts/create-central.sh).
#
# Architecture (single-source-of-truth model):
# ===========================================================================
# Each pool pins ONE immutable Percona BuildBarn runner image — full URL,
# immutable `:<distro>-<psmdb-version>-<mongo-sha>` tag on
# docker.io/perconalab/psmdb-rbe. The image is published in parallel by:
#   * Jenkins job hetzner-psmdb-buildbarn-runners (canonical for Bazel/RBE)
#     → docker.io/perconalab/psmdb-rbe (pulled at runtime by the worker)
#   * GHA workflow .github/workflows/build-psmdb-buildbarn-runners.yml
#     → ghcr.io/vorsel/psmdb-buildbarn-runners (read-only mirror, kept in
#       lockstep so reviewers can pull either coordinate). The Bazel
#       container-image URL below is the Docker Hub one — that is what
#       workers actually run.
#
# That URL serves THREE distinct purposes simultaneously:
#
#   1. ROUTING KEY (for bb-scheduler)
#      The Bazel client emits this URL (prefixed with `docker://`) as the
#      `container-image` exec property, sourced from PSMDB fork's
#      bazel/platforms/psmdb_rbe_containers.bzl. The scheduler does an
#      exact-match on the platform JSON against worker queues. Predeclared
#      queues materialised from THIS file have the same string baked in,
#      so the match is byte-for-byte stable.
#
#   2. CACHE INVALIDATION
#      The container-image string is part of the action digest. When ops
#      bumps the image (new Jenkins/GHA push) and updates BOTH ondemand-pools.yaml
#      AND PSMDB fork's psmdb_rbe_containers.bzl in lockstep, every action
#      gets a new digest → fresh remote execution, no stale cache hits.
#      Old cached entries remain valid for anyone still building from a
#      PSMDB checkout that pins the older URL.
#
#   3. RUNTIME IMAGE
#      docker compose on the worker VM literally pulls THIS URL via the
#      `image:` field — no shadow registry mapping. What the routing key
#      says is what the worker runs.
#
# Cross-release coexistence:
# ===========================================================================
# Multiple PSMDB release tags can be in active dev simultaneously
# (e.g. release-8.0.20-8 from image-sha A, release-8.0.21-9 from image-sha B).
# Each release's checkout has its own copy of psmdb_rbe_containers.bzl
# pinning a specific tag. We declare a separate pool per (distro, version,
# image-sha) tuple here and KEEP old entries until the corresponding PSMDB
# release goes EOL — only then is the pool removed and its scheduler queue
# disappears on the next deploy.
#
# Pool naming convention:
# ===========================================================================
# Pool keys (YAML map keys) follow `<runner-image-basename>__v<version>__<short-sha>`,
# where:
#   * runner-image-basename: `<distro>-<arch>` (e.g. ubuntu-noble-x86_64),
#     matching the leading distro segment of the Docker Hub tag plus the
#     pool's bazel_pool_value. Underscores survive (Hetzner labels allow
#     [a-zA-Z0-9._-]; the hostname slug logic in scaler.py / spawn-worker.sh
#     already replaces _ with - for VM names).
#   * v<version>: literal `v` prefix + psmdb_version with `.` → `_` to keep
#     the pool key free of FQDN-shaped dots. So 8.0 → v8_0, master → vmaster.
#   * short-sha: first 12 hex chars of the mongo-sha (last commit on the
#     PSMDB branch that touched percona-packaging/scripts/psmdb_builder.sh)
#     embedded in the immutable image tag. 12 chars is plenty for our
#     scale (uniqueness across <O(100) image generations) and keeps pool
#     keys legible.
# The full mongo-sha lives only in `runner_image`. The pool key short-sha
# is for human readability and Hetzner label matching; it never feeds the
# scheduler routing path.
#
# Maintenance procedures:
# ===========================================================================
# A) New image generation (Jenkins / GHA push, before any release):
#    1. Ops verifies the Jenkins job hetzner-psmdb-buildbarn-runners (and,
#       for parity, the GHA workflow) pushed the expected immutable tags:
#         docker.io/perconalab/psmdb-rbe:<distro>-<version>-<mongo-sha>
#       and the matching `:<distro>-<version>` moving alias.
#    2. Ops appends new pool entries to this file (or however many are in
#       scope — only one (version,distro) needs adding when supporting a
#       single release at a time).
#    3. Ops PRs the matching value into PSMDB fork's
#       bazel/platforms/psmdb_rbe_containers.bzl on the relevant release
#       branch (release-8.0 / release-8.3 / master).
#    4. Redeploy via scripts/create-central.sh; new predeclared queues
#       appear; new builds route to fresh pools; old pools continue to
#       serve in-flight release branches that haven't been bumped yet.
#
# B) PSMDB release EOL:
#    1. Confirm no active branch / tag references the old image URL:
#         git -C percona-server-mongodb grep -F "<image-sha>" \
#           release-8.0 release-8.3 master release-8.0.20-8 ...
#    2. Remove the matching pool entry below + redeploy. Predeclared queue
#       disappears; pool's CAS entries are still valid for the lifetime of
#       BuildBarn's CAS-side LRU.
#
# Pool → Bazel distro_or_os mapping (Percona pool name → what PSMDB's
# bzl emits for `distro_or_os-arch`):
# ===========================================================================
#   ubuntu-noble-x86_64       → ubuntu24-amd64           → bzl key "ubuntu24"
#   ubuntu-noble-aarch64      → ubuntu24-arm64           → bzl key "ubuntu24"           (all versions)
#   ubuntu-jammy-x86_64       → ubuntu22-amd64           → bzl key "ubuntu22"
#   ubuntu-jammy-aarch64      → ubuntu22-arm64           → bzl key "ubuntu22"           (all versions)
#   debian-bookworm-x86_64    → debian12-amd64           → bzl key "debian12"
#   debian-bookworm-aarch64   → debian12-arm64           → bzl key "debian12"           (all versions)
#   oraclelinux-8-x86_64      → rhel8-amd64              → bzl key "rhel8"              (OL8 ≡ RHEL8)
#   oraclelinux-8-aarch64     → rhel8-arm64              → bzl key "rhel8"              (OL8 ≡ RHEL8, all versions)
#   oraclelinux-9-x86_64      → rhel9-amd64              → bzl key "rhel9"              (OL9 ≡ RHEL9)
#   oraclelinux-9-aarch64     → rhel9-arm64              → bzl key "rhel9"              (OL9 ≡ RHEL9, all versions)
#   amazonlinux-2023-x86_64   → amazon_linux_2023-amd64  → bzl key "amazon_linux_2023"
#   amazonlinux-2023-aarch64  → amazon_linux_2023-arm64  → bzl key "amazon_linux_2023"  (all versions)

global:
  # Scheduler endpoints the scaler itself talks to.
  scheduler_state_grpc: 127.0.0.1:8984   # BuildQueueState (scaler reads)
  scheduler_public_url: null             # filled by create-central.sh (used for worker's browserUrl)
  scheduler_private_ip: null             # filled by create-central.sh (workers dial this for gRPC)

  # Hetzner project-wide defaults that every pool inherits.
  #
  # `hcloud_ssh_key_ids` and `hcloud_network_id` are project-scoped
  # numeric IDs that are *only* meaningful inside the Hetzner project
  # the central is deployed into. Hardcoding them here used to seem
  # convenient (one less env var) but bit us during the PSMDB-2034
  # cross-project migration: stale IDs from the OLD project leaked
  # through to the new project's bake, and the scaler logged
  # "SSH key not found (not_found, …)" for every spawn until the
  # operator manually fixed the on-disk YAML on the central host.
  #
  # Both fields are now HARD-OVERWRITTEN at bake time by
  # scripts/create-central.sh:sync_configs from the operator's
  # cluster.env ($SSH_KEY_IDS and $NETWORK_ID), plus the central's
  # own key id resolved by ensure_central_ssh_key(). The values
  # below are placeholders kept only so `python3 -c yaml.safe_load`
  # doesn't choke on a missing key during local sanity checks. They
  # are NOT used by anything at runtime.
  hcloud_ssh_key_ids: []                 # OVERWRITTEN by create-central.sh from $SSH_KEY_IDS + central key
  hcloud_network_id: null                # OVERWRITTEN by create-central.sh from $NETWORK_ID
  hcloud_os_image: debian-13             # host OS for workers; decoupled from runner distro

  # Region try-chain. hel1 first because the central lives there → lowest
  # intra-AZ latency between workers and CAS. nbg1/fsn1 are fallbacks for
  # capacity errors during EU peak (same pattern as htz.cloud.groovy).
  region_try_chain: [hel1, nbg1, fsn1]

  # Safety rails. The scaler REFUSES any action that would exceed these.
  # 150 = headroom for the hot-path ubuntu-noble-x86_64 pools (per-pool
  # max_nodes=25 across v8.0/v8.3/master = 75) plus burst room for the
  # remaining 33 declared pools at their default max_nodes=5. In steady
  # state Bazel clients target one (version, distro, arch) per build, so
  # one pool burst dominates; this cap protects against runaway scaling
  # if multiple release-matrix builds land concurrently.
  max_total_nodes: 150                   # cap across all pools combined
  max_cost_per_hour_eur: 2.0             # sum of current VM hourly rates

  # Control loop timings.
  poll_interval_seconds: 30              # how often the scaler polls BuildQueueState
  scale_down_idle_seconds: 600           # 10 min — matches Hetzner per-hour billing granularity
  scale_up_threshold: 1                  # minimum queued ops before we spawn; desired-fleet math (ceil((queued+executing)/concurrency)) runs only once this floor is crossed

# ===========================================================================
# AWS Graviton fallback (optional). See ../../aws-graviton-fallback.md.
# ===========================================================================
# When an aarch64 pool with `aws_instance_type` set exhausts EVERY Hetzner
# region in region_try_chain (CAX capacity unavailable — the 10-15h-hang
# problem this addresses), the scaler spawns the pool on AWS Graviton
# instead. Those workers reach the central over the WireGuard tunnel
# defined below. Secrets/account-specific values (creds, subnet, SG, AMI,
# hub pubkey/endpoint) come from .env — only non-secret shape lives here.
#
# enabled: false → the whole feature is inert; aws_instance_type on a pool
#   is ignored and Hetzner exhaustion just logs an error (today's behaviour).
aws:
  enabled: true
  # Fall back to AWS for EVERY aarch64 pool on Hetzner exhaustion (a full build
  # matrix routes to many distro-specific aarch64 pools — jammy/OL8/OL9/
  # amazonlinux/bookworm/noble — all of which need fallback, not just a few).
  # x86_64 pools are never affected. Per-pool `aws_fallback: true` still works
  # as an explicit opt-in if you ever want to scope it narrower.
  fallback_all_aarch64: true
  region: eu-central-1        # closest to hel1 → lowest CAS-over-tunnel latency
  use_spot: true              # spot is REQUIRED here (workers are interruptible;
                              #   bb-scheduler re-queues in-flight actions to a
                              #   replacement on reclaim — see aws-graviton-fallback.md §6)
  billing_tag: psmdb-worker   # iit-billing-tag: isolates cost + satisfies the
                              #   percona-dev-admin cleanup Lambdas. AWS infra
                              #   (subnet/SG) MUST be dedicated so billing doesn't
                              #   touch existing resources.
  # Diversified Graviton spot pool. Every type is 8 vCPU / >=32 GB RAM — at
  # least as good as Hetzner cax31 (8c / 16 GB) on both axes, faster Neoverse
  # cores. Multiple families (m=32GB, r=64GB, -d adds local NVMe) and
  # generations (6/7/8) = many spot capacity pools, so no-capacity and
  # interruption pressure spread out. The scaler tries them in order on
  # InsufficientInstanceCapacity (like Hetzner's region_try_chain). Mirrors the
  # proven percona-cd-platform jenkins-arm-fleet set. Per-pool override via the
  # pool's own `aws_instance_types`.
  instance_types: [m7g.2xlarge, m6g.2xlarge, m8g.2xlarge, m7gd.2xlarge, m6gd.2xlarge, r7g.2xlarge, r6g.2xlarge, r8g.2xlarge]
  # subnet_id / security_group_ids / ami_id come from .env
  # (AWS_SUBNET_ID / AWS_SECURITY_GROUP_IDS / AWS_AMI_ID).

# WireGuard hub on the central. hub_pubkey / hub_endpoint / allowed_ips are
# written into .env by scripts/setup-wireguard-hub.sh; left here for shape.
wireguard:
  iface: wg0
  cidr: 10.99.0.0/16          # tunnel address pool for AWS workers
  hub_ip: 10.99.0.1           # the central's tunnel address (reserved)
  # hub_pubkey / hub_endpoint / allowed_ips: see .env

# Pools. Each key becomes the Hetzner label `psmdb.pool=<key>` on spawned VMs.
#
# Current image generation (Phase 2 PoC migration — see
# IaC/buildbarn/runners/README.md "Phased migration plan" for context):
# Each tag suffix is the SHA of the last commit touching
# percona-packaging/scripts/psmdb_builder.sh on the corresponding
# vorsel/percona-server-mongodb branch —
# PSMDB-2054_psmdb_rbe_support_in_build_routines__master for master, a
# per-ticket branch for v8.0 and v8.3 (both lines have moved past PSMDB-2054):
#   - master: mongo SHA 52917c227b04255a129d9b5617228c2269662871
#   - v8.3:   mongo SHA 2d593e6f8e85df6f1865ceff13993a02a595d856
#             (PSMDB-2198_psmdb83_add_deb13_trixie_amd64_arm64_support)
#   - v8.0:   mongo SHA a7a131ec9cd863d4cdd261bb10acb69d2946c020
#             (PSMDB-2205_psmdb8.0_update_rbe_workers)
# Tag suffix appears in every runner_image below; pool key short-sha is
# the first 12 chars — EXCEPT the 8.0 and 8.3 lines, whose pool keys now use
# a lifecycle tier marker (__main = current, __old = previous, to drop once
# unreferenced) instead of the short-sha. The real SHA still lives only in
# runner_image (the sole routing source of truth); the key suffix is a
# human label the scaler never parses.
#
# Coverage: 124 pools. Every distro is an x86_64 + aarch64 sibling pair
# (including debian-bookworm, since IaC/buildbarn/runners/debian-bookworm-
# aarch64/ was added), so per-generation counts are always even. Every pool
# is min_nodes: 0 — an unreferenced one costs nothing until an action routes
# to it, which is why demoted generations can linger.
#   * v8.0   — 34: __main 9 distros x2 (a7a131ec9cd8)
#                + __old  8 distros x2 (b0032483117d, what upstream/v8.0 pins)
#   * v8.3   — 60: __main 9 distros x2 (2d593e6f8e85, PSMDB-2198/deb13)
#                + 9 distros x2 (57029e0d8453, PSMDB-2197/el10)
#                + __old  6 distros x2 (ac06e9e70d1a, what upstream/v8.3 pins)
#                + 6 distros x2 (7517cebc3bd1, two pre-ac06e9e7 branches)
#                Both feature generations collapse into one __main once
#                PSMDB-2197 and PSMDB-2198 merge and v8.3 is rebuilt.
#   * master — 30: three in-flight generations, pool keys still use short-sha
#
# Why aarch64 siblings can share `runner_image` with their x86_64 sibling:
# the URL points to a multi-arch manifest list (one per (distro, version,
# sha) GHA build), so a worker pulls the right layer based on its host
# arch automatically. The two siblings differ only in
# `bazel_pool_value` (x86_64 vs aarch64) — that's what the bb-scheduler
# uses as the routing-key-tuple discriminator together with the
# `container-image` URL.
#
# Server type for aarch64 is cax31 (8c shared / 16 GB / 160 GB local —
# Hetzner ARM Neoverse), the ARM equivalent of cpx42. €0.0256/h in
# fsn1 / hel1 / nbg1, identical region availability to cpx42.
pools:

  # ==========================================================================
  # ubuntu-noble (Ubuntu 24.04) — distro_or_os "ubuntu24"
  # ==========================================================================
  ubuntu-noble-x86_64__v8_0__main:
    runner_image: "docker.io/perconalab/psmdb-rbe:ubuntu-noble-8.0-a7a131ec9cd863d4cdd261bb10acb69d2946c020"
    bazel_pool_value: x86_64
    psmdb_version: "8.0"
    server_type: cpx42
    concurrency: 12
    min_nodes: 0
    max_nodes: 25

  ubuntu-noble-aarch64__v8_0__main:
    runner_image: "docker.io/perconalab/psmdb-rbe:ubuntu-noble-8.0-a7a131ec9cd863d4cdd261bb10acb69d2946c020"
    bazel_pool_value: aarch64
    psmdb_version: "8.0"
    server_type: cax31
    concurrency: 12
    min_nodes: 0
    max_nodes: 5
    # Opt into AWS Graviton fallback (active only when aws.enabled: true).
    # Uses the global aws.instance_types pool; override here with
    # `aws_instance_types: [...]` if this pool needs different shapes.
    aws_fallback: true

  ubuntu-noble-x86_64__v8_3__main:
    runner_image: "docker.io/perconalab/psmdb-rbe:ubuntu-noble-8.3-2d593e6f8e85df6f1865ceff13993a02a595d856"
