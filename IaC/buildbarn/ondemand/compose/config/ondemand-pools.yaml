# Declarative pool config consumed by the scaler daemon and by
# create-central.sh (which generates config/predeclared.libsonnet from this
# file at bake time — see bake_env() in scripts/create-central.sh).
#
# Architecture (single-source-of-truth model):
# ===========================================================================
# Each pool pins ONE immutable Percona BuildBarn runner image — full URL,
# immutable `:<psmdb-version>-<git-sha>` tag — pushed by GHA workflow
# .github/workflows/build-psmdb-buildbarn-runners.yml. That URL serves THREE
# distinct purposes simultaneously:
#
#   1. ROUTING KEY (for bb-scheduler)
#      The Bazel client emits this URL (prefixed with `docker://`) as the
#      `container-image` exec property, sourced from PSMDB fork's
#      bazel/platforms/psmdb_rbe_containers.bzl. The scheduler does an
#      exact-match on the platform JSON against worker queues. Predeclared
#      queues materialised from THIS file have the same string baked in,
#      so the match is byte-for-byte stable.
#
#   2. CACHE INVALIDATION
#      The container-image string is part of the action digest. When ops
#      bumps the image (new GHA push) and updates BOTH ondemand-pools.yaml
#      AND PSMDB fork's psmdb_rbe_containers.bzl in lockstep, every action
#      gets a new digest → fresh remote execution, no stale cache hits.
#      Old cached entries remain valid for anyone still building from a
#      PSMDB checkout that pins the older URL.
#
#   3. RUNTIME IMAGE
#      docker compose on the worker VM literally pulls THIS URL via the
#      `image:` field — no shadow registry mapping. What the routing key
#      says is what the worker runs.
#
# Cross-release coexistence:
# ===========================================================================
# Multiple PSMDB release tags can be in active dev simultaneously
# (e.g. release-8.0.20-8 from image-sha A, release-8.0.21-9 from image-sha B).
# Each release's checkout has its own copy of psmdb_rbe_containers.bzl
# pinning a specific tag. We declare a separate pool per (distro, version,
# image-sha) tuple here and KEEP old entries until the corresponding PSMDB
# release goes EOL — only then is the pool removed and its scheduler queue
# disappears on the next deploy.
#
# Pool naming convention:
# ===========================================================================
# Pool keys (YAML map keys) follow `<runner-image-basename>__v<version>__<short-sha>`,
# where:
#   * runner-image-basename: the trailing component of the GHCR repo path,
#     e.g. ubuntu-noble-x86_64. Underscores survive (Hetzner labels allow
#     [a-zA-Z0-9._-]; the hostname slug logic in scaler.py / spawn-worker.sh
#     already replaces _ with - for VM names).
#   * v<version>: literal `v` prefix + psmdb_version with `.` → `_` to keep
#     the pool key free of FQDN-shaped dots. So 8.0 → v8_0, master → vmaster.
#   * short-sha: first 12 hex chars of the GHA <git-sha> suffix from the
#     immutable image tag. 12 chars is plenty for our scale (uniqueness
#     across <O(100) image generations) and keeps pool keys legible.
# The full git-sha lives only in `runner_image`. The pool key short-sha is
# for human readability and Hetzner label matching; it never feeds the
# scheduler routing path.
#
# Maintenance procedures:
# ===========================================================================
# A) New image generation (GHA push, before any release):
#    1. Ops verifies the GHA run pushed all 6×3 expected immutable tags
#       (ghcr query: `:<version>-<github.sha>` per runner).
#    2. Ops appends 18 new pool entries to this file (or however many are
#       in scope — only one (version,distro) needs adding when supporting
#       a single release at a time).
#    3. Ops PRs the matching value into PSMDB fork's
#       bazel/platforms/psmdb_rbe_containers.bzl on the relevant release
#       branch (release-8.0 / release-8.3 / master).
#    4. Redeploy via scripts/create-central.sh; new predeclared queues
#       appear; new builds route to fresh pools; old pools continue to
#       serve in-flight release branches that haven't been bumped yet.
#
# B) PSMDB release EOL:
#    1. Confirm no active branch / tag references the old image URL:
#         git -C percona-server-mongodb grep -F "<image-sha>" \
#           release-8.0 release-8.3 master release-8.0.20-8 ...
#    2. Remove the matching pool entry below + redeploy. Predeclared queue
#       disappears; pool's CAS entries are still valid for the lifetime of
#       BuildBarn's CAS-side LRU.
#
# Pool → Bazel distro_or_os mapping (Percona pool name → what PSMDB's
# bzl emits for `distro_or_os-arch`):
# ===========================================================================
#   ubuntu-noble-x86_64       → ubuntu24-amd64           → bzl key "ubuntu24"
#   ubuntu-jammy-x86_64       → ubuntu22-amd64           → bzl key "ubuntu22"
#   debian-bookworm-x86_64    → debian12-amd64           → bzl key "debian12"
#   oraclelinux-8-x86_64      → rhel8-amd64              → bzl key "rhel8"   (OL8 ≡ RHEL8)
#   oraclelinux-9-x86_64      → rhel9-amd64              → bzl key "rhel9"   (OL9 ≡ RHEL9)
#   amazonlinux-2023-x86_64   → amazon_linux_2023-amd64  → bzl key "amazon_linux_2023"

global:
  # Scheduler endpoints the scaler itself talks to.
  scheduler_state_grpc: 127.0.0.1:8984   # BuildQueueState (scaler reads)
  scheduler_public_url: null             # filled by create-central.sh (used for worker's browserUrl)
  scheduler_private_ip: null             # filled by create-central.sh (workers dial this for gRPC)

  # Hetzner project-wide defaults that every pool inherits.
  #
  # `hcloud_ssh_key_ids` — numeric ids of named SSH keys uploaded to
  # Hetzner. Every id listed here gets its pubkey injected into the
  # new worker's /root/.ssh/authorized_keys at VM-create time (Hetzner
  # has no API to add SSH keys AFTER creation, so the list is fixed
  # per-VM-lifecycle).
  #
  # An additional id is auto-appended at bake time by
  # scripts/create-central.sh:sync_configs → python yaml round-trip:
  # the numeric id of the Hetzner named key `bb-psmdb-ondemand-central`,
  # which carries the central's own /root/.ssh/id_ed25519.pub. This is
  # what lets the central ssh into workers over the private network
  # (required once we drop public IPs from workers).
  hcloud_ssh_key_ids:
    - 24333399         # htz.cd.key — operator's daily-driver key
    - 111196538        # htz.cd.bb-psmdb-ondemand — per-fleet key
    # bb-psmdb-ondemand-central id is APPENDED here at bake time.
  hcloud_network_id: 11374636            # psmdb.cd.percona.com private net
  hcloud_os_image: debian-13             # host OS for workers; decoupled from runner distro

  # Region try-chain. hel1 first because the central lives there → lowest
  # intra-AZ latency between workers and CAS. nbg1/fsn1 are fallbacks for
  # capacity errors during EU peak (same pattern as htz.cloud.groovy).
  region_try_chain: [hel1, nbg1, fsn1]

  # Safety rails. The scaler REFUSES any action that would exceed these.
  # 60 = 6 distros × 5 max nodes each (with up to ~3 active versions sharing
  # capacity). In steady state at most ~6 pools burst to max simultaneously
  # because Bazel clients usually target one (version, distro) per build.
  # Revisit if we keep multiple release-tag pools warm at once or add aarch64
  # pools.
  max_total_nodes: 60                    # cap across all pools combined
  max_cost_per_hour_eur: 2.0             # sum of current VM hourly rates

  # Control loop timings.
  poll_interval_seconds: 30              # how often the scaler polls BuildQueueState
  scale_down_idle_seconds: 600           # 10 min — matches Hetzner per-hour billing granularity
  scale_up_threshold: 1                  # minimum queued ops before we spawn; desired-fleet math (ceil((queued+executing)/concurrency)) runs only once this floor is crossed

# Pools. Each key becomes the Hetzner label `psmdb.pool=<key>` on spawned VMs.
#
# Current image generation: 8.0/8.3/master @ git-sha 9873907c9659eb73f84e6d63571bca6667861f80
# (jenkins-pipelines tip at GHA build time; tag suffix in every runner_image
# below). The pool key short-sha is the first 12 chars of that git-sha.
#
# Coverage: 6 x86_64 distros × 3 PSMDB versions = 18 pools. aarch64 pools
# are NOT scaffolded yet (would need Hetzner CAX server types, arm64 GHA
# runners verified, arm64 host Debian image). The structure here is
# arch-symmetric — adding aarch64 is a copy/paste with s/cpx42/cax41/,
# s/x86_64/aarch64/, s/amd64/arm64/ once the runner images land.
