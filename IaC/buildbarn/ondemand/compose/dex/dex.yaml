# Dex — OpenID Connect Identity Provider used as a bridge between the
# Buildbarn web UIs (bb-browser :7984, bb-scheduler admin :7982) and
# GitHub OAuth.
#
# Why Dex sits in the middle and we don't talk to GitHub directly:
#
# Buildbarn's native OIDC implementation (see bb-storage/pkg/proto/
# configuration/http/server/server.proto :: OIDCAuthenticationPolicy)
# can extract claims with one JMESPath expression against ONE user_info
# response. GitHub's OAuth user_info endpoint (`/user`) does not return
# team membership — that's a separate `/orgs/{org}/teams/{slug}/
# memberships/{user}` call. Dex's GitHub connector knows how to make
# all those calls, validate the user is in at least one of the
# `orgs[].teams[]` we whitelist below, and pack the result into a
# single `groups` claim that Buildbarn's JMESPath can match in one
# shot. That's why we add a tiny IdP container instead of pointing
# Buildbarn straight at GitHub.
#
# Substitution rules (Dex v2.41.1, see storage/storage.go +
# cmd/dex/config.go):
#
#   * Inside `connectors[].config.*` and `storage.config.*`:
#     `$VAR` and `${VAR}` are expanded via os.ExpandEnv at config load
#     (gated by DEX_EXPAND_ENV, defaults to true). That's how the
#     GitHub OAuth client_id/secret below get injected.
#
#   * Inside `staticClients[]`: the `$VAR` form is NOT expanded —
#     `Secret`/`ID` are stored verbatim. To pull a value from env,
#     use the dedicated `secretEnv: VAR_NAME` / `idEnv: VAR_NAME`
#     fields (without `$`), which Dex resolves via os.Getenv at the
#     same load step. Mixing the two patterns silently breaks token
#     exchange (Dex stores `"$VAR"` as the secret, BB sends the real
#     value, /token returns "invalid_client"). Bit us once on first
#     OIDC login attempt — see commit message.
#
# Values come from the docker-compose `environment:` block, populated
# by the central `.env` file (mode 0600, baked by create-central.sh).

# `issuer` is the public URL clients (bb-browser, bb-scheduler) will
# embed in their OIDC discovery requests AND that Dex will sign into
# the `iss` claim of every ID token it mints. It must:
#   * be reachable from clients (verified via /.well-known/openid-configuration)
#   * match the SAN of the TLS cert presented on `web.https` below
#   * stay stable — changing it invalidates every refresh token in flight
issuer: https://bb-psmdb.ddns.net:5556

# Persistent storage for auth-codes (10 min TTL), refresh tokens
# (1 y TTL — see `expiry` below), offline sessions, and Dex's own
# JWT signing-key history (rotates every 6 h, retains 24 h of past
# kids so already-issued tokens stay valid until they expire).
# SQLite was chosen over `memory:` because losing this state on a
# Dex container restart would force every active operator through
# a fresh GitHub login flow; over Postgres because the data set is
# tiny (KBs), interactive, and lives on the same persistent BB
# volume that already holds the cache. Migration to Postgres later
# is a config-only swap — no data needs to be carried over.
storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

# Public-facing HTTPS listener. We deliberately do NOT front Dex
# with Envoy / nginx: Dex speaks TLS natively and reuses the same
# Let's Encrypt cert that envoy-proxy / bb-browser / bb-scheduler
# already present, so there's nothing to gain from a second hop.
# The cert directory is /var/lib/buildbarn/certs on the host
# (resolved fullchain + privkey, mode 0644, refreshed in-place by
# certbot's deploy-hook), mounted read-only at /etc/buildbarn/certs.
# Dex re-reads the files on TLS handshake misses, so the deploy-hook
# `docker compose restart dex` line keeps cert rotation hands-off
# (a stale cert would only hit users on the next renewal cycle).
web:
  https: 0.0.0.0:5556
  tlsCert: /etc/buildbarn/certs/fullchain.pem
  tlsKey:  /etc/buildbarn/certs/privkey.pem

# OAuth2-level knobs.
oauth2:
  # Dex's default consent screen ("Buildbarn Browser would like to
  # access your account") adds a click for no security gain — the
  # user already trusts the central control plane and we're not
  # asking for arbitrary data, just identity. Skipping it makes the
  # login UX feel native (one redirect to GitHub, one back).
  skipApprovalScreen: true
  # Force PKCE for all clients. bb-browser / bb-scheduler are
  # confidential clients (server-side secrets), so this is belt-and-
  # suspenders, but it's free and fends off auth-code replay if a
  # client secret ever leaks.
  passwordConnector: ""
  alwaysShowLoginScreen: false
  # Step 5c — Jenkins CI auth via OAuth 2.0 Token Exchange (RFC 8693).
  # Once `grantTypes:` is set Dex disables the defaults, so EVERY grant
  # we still rely on must be enumerated explicitly. Adding a new grant
  # here without the existing four breaks every browser login flow plus
  # bazel-cli device-code login (i.e. all human paths) on `docker
  # compose restart dex`.
  grantTypes:
  - authorization_code                                  # bb-browser, bb-scheduler-admin, bb-portal browser logins
  - refresh_token                                       # silent re-issue + idle-rotation for the three UIs above
  - urn:ietf:params:oauth:grant-type:device_code        # bazel-cli (Device Authorization Grant) — human dev login
  - urn:ietf:params:oauth:grant-type:token-exchange     # bazel-jenkins (RFC 8693) — CI auth from Jenkins-issued JWT

# Token TTLs. See decisions log §5 in buildbarn-auth-tls-plan.md.
#
# idTokens=1h: short enough that a revoked GitHub team membership
#   takes effect within an hour even if the user keeps a tab open.
# refreshTokens.absoluteLifetime=8760h (1 y): matches the JWT
#   lifetime decision for human users; on hard expiry the operator
#   re-clicks "Sign in with GitHub" — 5-second flow.
# refreshTokens.validIfNotUsedFor=2160h (90 d idle): forces inactive
#   sessions out before they hit absolute expiry.
# signingKeys: defaults (rotate=6h, retain=24h) are fine.
expiry:
  idTokens: 1h
  refreshTokens:
    reuseInterval: 5s
    validIfNotUsedFor: 2160h
    absoluteLifetime: 8760h

# Where the user is actually authenticated. We use ONE connector —
# GitHub — and rely on org+team gating for authorization. No
# password connector, no LDAP, no SAML. If we ever need a CI bot
# identity, we'll add a `static_passwords` block (off by default).
connectors:
- type: github
  id: github
  name: GitHub
  config:
    clientID:     $GITHUB_OAUTH_CLIENT_ID
    clientSecret: $GITHUB_OAUTH_CLIENT_SECRET
    # Must match exactly what is registered in the GitHub OAuth App
    # (Settings → Developer settings → OAuth Apps). A mismatch fails
    # at the GitHub callback with `redirect_uri_mismatch`.
    redirectURI:  https://bb-psmdb.ddns.net:5556/callback

    # Authorization gate. A user is allowed in iff they are a member
    # of at least one of the listed `orgs[].teams[]`. Anyone outside
    # these teams (including org admins not on the teams) is rejected
    # at login with "User <login> is not in any of the required
    # organizations or teams".
    #
    # MAINTENANCE: team names here are GitHub `slug`s, not display
    # names — see buildbarn-auth-tls-plan.md §6 for the lookup
    # command. Adding a team = edit list + `docker compose restart dex`.
    # Removing a team = same; existing refresh tokens for users in
    # only the removed team will fail their next refresh and force
    # a re-login (which then bounces them).
    orgs:
    - name: percona
      teams:
      - build-engineers
      - iit
      - dev-psmdb

    # `loadAllGroups: false` means Dex only emits the `groups` claim
    # for the teams in the allow-list above (not every team the user
    # happens to be in). Keeps the JWT small and prevents accidental
    # over-disclosure of org structure to clients.
    loadAllGroups: false

    # Use slugs, not display names, in the emitted `groups` claim.
    # Buildbarn's JMESPath authorization expression matches on slugs.
    teamNameField: slug

    # Allow re-auth without going through GitHub's consent screen
    # again on every refresh — refresh tokens validate against
    # GitHub's API, so a deleted team membership still kicks in
    # within minutes regardless.
    useLoginAsID: false

# Step 5c — Jenkins as an upstream OIDC IdP for CI token exchange.
#
# Jenkins runs the OpenID Connect Provider plugin
# (https://plugins.jenkins.io/oidc-provider/) which exposes
#   /oidc/.well-known/openid-configuration  (discovery)
#   /oidc/jwks                              (RS256 public key)
# anonymously on https://psmdb.cd.percona.com — anonymous read for those
# two paths is granted by the nginx allow-list maintained via the
# `manage-nginx-allow-list` job (the central VM's Hetzner Floating IP
# 95.217.242.120 is on it).
#
# Pipelines mint short-lived (~60 min) RS256 id_tokens via
# `withCredentials([string(credentialsId: 'PSMDB-RBE-OIDC', ...)])` and
# POST them to https://bb-psmdb.ddns.net:5556/token with
# grant_type=urn:ietf:params:oauth:grant-type:token-exchange and
# connector_id=jenkins-percona (this connector). Dex verifies the
# signature, lifts `sub` (the job URL) into the federated identity, and
# mints a Dex-side id_token whose aud=bazel-jenkins (the staticClient
# below). Bazel then uses ONLY the Dex-issued token in --remote_header,
# never the Jenkins one — Envoy on :8981 / :1985 trusts only Dex's JWKS
# (see reapi-proxy/envoy.yaml dex_provider), so the trust universe stays
# single-rooted.
- type: oidc
  id: jenkins-percona
  name: 'Jenkins Percona'
  config:
    # Must match `iss` in tokens emitted by the OIDC Provider plugin
    # exactly, byte-for-byte. The plugin defaults to <jenkins-host>/oidc
    # (no trailing slash); changing the issuer URI in the plugin without
    # updating this line silently breaks `/token` exchange with
    # `oidc: id token issued by a different provider`.
    issuer: https://psmdb.cd.percona.com/oidc
    # Map Jenkins's `sub` claim (which is the job URL,
    # e.g. https://psmdb.cd.percona.com/job/percona-server-for-mongodb-8.3/)
    # into Dex's userID. Audit logs and Dex-issued tokens carry this as
    # the federated identity, so a request traced through bb-portal
    # points back at the exact Jenkins job that requested it. Tighten
    # later (e.g. via groups claim mapping) if we want subject-prefix
    # ACLs in BB or Envoy.
    userNameKey: sub
    # Override the connector default scopes (`["profile", "email"]`).
    # Jenkins's OIDC Provider plugin doesn't emit `email` and we have
    # no use for it — the federated identity is the job URL via `sub`.
    # Leaving the default in would cause Dex to enforce
    # `hasEmailScope` (see connector/oidc/oidc.go) and reject every
    # exchange with `missing email claim, not found "email" key`.
    scopes:
    - openid
    # Token-exchange flow doesn't need a redirect URI nor a clientID/
    # clientSecret pair on the connector itself — the `bazel-jenkins`
    # staticClient handles the auth at /token. Leaving these unset is
    # explicitly supported per
    # https://dexidp.io/docs/guides/token-exchange/ §"Configuring dex".

# Static OAuth clients — i.e. the Buildbarn web services that will
# delegate login to Dex once Step 4 wires them up. Defining them
# here in Step 3 means smoke-testing the full Discovery → /token
# loop is possible TODAY, before bb-browser / bb-scheduler are
# OIDC-aware.
#
# Each client gets:
#   * a stable `id` referenced by the bb-browser / bb-scheduler
#     `oidc.client_id` field
#   * a per-service `secret` (random 32 bytes hex, generated and
#     stashed in .env by create-central.sh)
#   * the exact `redirect_uris` that bb-browser / bb-scheduler will
#     register — these have to match character-for-character or
#     Dex rejects the auth request
staticClients:
- id: bb-browser
  name: 'Buildbarn Browser'
  secretEnv: BB_BROWSER_OIDC_SECRET
  redirectURIs:
  - https://bb-psmdb.ddns.net:7984/oidc-callback
- id: bb-scheduler-admin
  name: 'Buildbarn Scheduler Admin'
  secretEnv: BB_SCHED_OIDC_SECRET
  redirectURIs:
  - https://bb-psmdb.ddns.net:7982/oidc-callback
# bb-portal — build observability UI (build history, BES ingest).
# Same OIDC posture as bb-browser / bb-scheduler-admin: confidential
# client with a per-service secret in .env (BB_PORTAL_OIDC_SECRET,
# generated by create-central.sh's bake_env step). The redirect URI
# uses `/oidc-callback` for consistency with the other two BB UIs —
# bb-portal embeds the same bb-storage HTTP-server library, so the
# path is configurable, not pinned, and matching the pattern keeps
# this list grep-able. See buildbarn-portal-plan.md §"Step 2 →
# Decision A" for the coexistence rationale (Phase 1: bb-portal
# stands up beside the other two; Phase 2: this entry stays, the
# bb-browser / bb-scheduler-admin entries above are deleted).
- id: bb-portal
  name: 'Buildbarn Portal'
  secretEnv: BB_PORTAL_OIDC_SECRET
  redirectURIs:
  - https://bb-psmdb.ddns.net:7986/oidc-callback
# Step 5: Bazel CLI client for the Device Authorization Grant
# (RFC 8628). This client is PUBLIC — it has no secret because Bazel
# clients run on developer machines / CI runners where we cannot
# safely keep one. Security comes from PKCE (mandatory in Dex when
# `oauth2.passwordConnector == ""`) plus the team-membership gate in
# the GitHub connector above (a stolen device_code is useless without
# also passing GitHub OAuth as a member of one of the allowed teams).
#
# `redirectURIs` is unintuitive for a Device Code client and contains
# TWO entries for two different reasons:
#
#   * `urn:ietf:wg:oauth:2.0:oob` — the RFC-6749-blessed "out-of-band"
#     placeholder. Dex's static-client validator requires the list be
#     non-empty even though Device Code flow has no real callback URL
#     for the *RBE client* side.
#
#   * `/device/callback` — REQUIRED by Dex internally. When the user
#     opens https://.../device, picks GitHub, and is bounced through
#     GitHub OAuth, Dex starts an *internal* OIDC flow with
#     `redirect_uri=/device/callback` (its own handler that finishes
#     the device-code → id_token exchange). That `redirect_uri` is
#     validated against this client's redirectURIs list — same
#     validator as for any other OAuth flow, no special-case for the
#     device path. Without `/device/callback` here, the GitHub login
#     step terminates with `Bad Request: Unregistered redirect_uri
#     ("/device/callback")` and the user_code never gets approved.
#     This is a Dex-side wart, not an OAuth spec quirk.
#
# Audience: id_tokens minted for this client carry `aud: ["bazel-cli"]`,
# which Envoy's jwt_authn filter on :8981 verifies on every Bazel RPC.
- id: bazel-cli
  name: 'Bazel RBE CLI'
  public: true
  redirectURIs:
  - urn:ietf:wg:oauth:2.0:oob
  - /device/callback

# Step 5c — Jenkins CI client for the Token Exchange grant
# (RFC 8693, see https://dexidp.io/docs/guides/token-exchange/).
#
# Token exchange is the OIDC equivalent of GCP Workload Identity
# Federation / AWS Web Identity Federation: instead of stashing a
# long-lived Dex refresh token in Jenkins credentials (and dealing with
# the rotation drama imposed by `reuseInterval: 5s` above), each
# pipeline mints a fresh ~60-min Jenkins-side id_token via the OIDC
# Provider plugin and exchanges it at /token for a Dex-side id_token
# carrying `aud: ["bazel-jenkins"]` and `sub` lifted from the Jenkins
# token (the job URL). Bazel uses the Dex-side token in
# --remote_header; the Jenkins-side one is one-shot and discarded.
#
# `public: true` — Jenkins pipelines pass any client_secret through
# `withCredentials` plumbing into a curl invocation visible to the
# build agent process, which is the textbook definition of a public
# client per https://dexidp.io/docs/configuration/custom-scopes-claims-clients/#public-clients.
# Dex's token-exchange code path validates auth via the static-client
# id alone (no secret check) when `public: true`.
#
# No real redirect URI applies to token exchange (no browser callback),
# but Dex's static-client validator still requires `redirectURIs:` be
# non-empty — same wart as bazel-cli above. The OOB placeholder
# satisfies the validator without implying any browser flow.
- id: bazel-jenkins
  name: 'Bazel RBE Jenkins'
  public: true
  redirectURIs:
  - urn:ietf:wg:oauth:2.0:oob

# Logging — JSON to stdout so docker compose / journald pick it up
# uniformly with the other services on this host.
logger:
  level: info
  format: json
