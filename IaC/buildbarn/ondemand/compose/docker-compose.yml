# BuildBarn control-plane for the PSMDB ondemand fleet.
#
# This compose file lives on the central host at /var/lib/buildbarn/compose/
# (rsync'd by scripts/create-central.sh). The CAS/AC/FSAC ring buffers and
# persistent_state dirs live on the xfs volume
# psmdb-buildbarn-cas-ondemand (Hetzner volume 105484418, 750 GB, mounted
# at /var/lib/buildbarn) — so this entire stack is stateless on the host
# boot disk and can be recreated from scratch at any time by reattaching
# the volume and re-running create-central.sh with mode=attach.
#
# Port strategy (user decision, see buildbarn-ondemand-scaler.md §6):
#
#   PUBLIC  (0.0.0.0)           PRIVATE (${PRIVATE_IP})     LOCAL (127.0.0.1)
#   ──────────────────────────  ──────────────────────────  ──────────────────
#   7982  scheduler admin HTML  8980  frontend (worker CAS) 8984  buildQueueState
#   7984  bb-browser            8983  scheduler ↔ workers         (scaler only)
#   8981  Envoy / Bazel clients
#
#   Rationale: 8981 (Bazel clients) is exposed publicly with TLS+JWT auth
#   (see envoy.yaml, Step 1+5 of buildbarn-auth-tls-plan.md). Workers run
#   inside the Hetzner private network on ondemand VMs, so they reach the
#   central's CAS/AC/FSAC directly via bb-frontend's :8980 (plaintext, no
#   auth — the network IS the boundary on this path). Bypassing Envoy for
#   workers avoids provisioning service-account JWTs to every spawned VM
#   and removes the TLS handshake from every CAS read. See
#   worker/config/common.libsonnet header for the long version.
#   Worker scheduler dispatch (8983) stays private — same reasoning.
#   BuildQueueState (8984) stays localhost because the scaler daemon
#   runs on THIS host.
#
# Workers and their runner sidecars are NOT defined here — they live on
# ephemeral ondemand VMs bootstrapped by the scaler (see §5.2).

name: bb-psmdb-ondemand

x-bb-image-common: &bb-image-common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  # ---------------------------------------------------------------------
  # Storage shard 0. Owns half of the sharded CAS/AC/FSAC key space.
  # On-disk layout lives on the xfs volume via bind mounts from
  # /var/lib/buildbarn/storage-{cas,ac,fsac}-0 — that's the ring-buffer
  # block file, the key_location_map, and the persistent_state dir that
  # lets the shard survive restarts without losing the in-memory index.
  # Sized at 369 GB total (see config/storage.jsonnet for the breakdown).
  # ---------------------------------------------------------------------
  storage-0:
    <<: *bb-image-common
    image: ghcr.io/buildbarn/bb-storage:${BB_STORAGE_TAG}
    command: [/config/storage.jsonnet]
    expose:
      - "8981"   # gRPC — only other compose services call this
    volumes:
      - ./config:/config:ro
      - /var/lib/buildbarn/storage-cas-0:/storage-cas
      - /var/lib/buildbarn/storage-ac-0:/storage-ac
      - /var/lib/buildbarn/storage-fsac-0:/storage-fsac

  # ---------------------------------------------------------------------
  # Storage shard 1 — identical config to shard 0 but on different
  # backing directories (so losing one shard doesn't nuke the other).
  # ---------------------------------------------------------------------
  storage-1:
    <<: *bb-image-common
    image: ghcr.io/buildbarn/bb-storage:${BB_STORAGE_TAG}
    command: [/config/storage.jsonnet]
    expose:
      - "8981"
    volumes:
      - ./config:/config:ro
      - /var/lib/buildbarn/storage-cas-1:/storage-cas
      - /var/lib/buildbarn/storage-ac-1:/storage-ac
      - /var/lib/buildbarn/storage-fsac-1:/storage-fsac

  # ---------------------------------------------------------------------
  # Frontend — Bazel clients hit this via Envoy (below). Splits each call
  # across both storage shards and delegates Execute calls to the
  # scheduler. Stateless: no volumes beyond /config.
  # ---------------------------------------------------------------------
  frontend:
    <<: *bb-image-common
    # Frontend is bb-storage running a different config file; same image tag.
    image: ghcr.io/buildbarn/bb-storage:${BB_STORAGE_TAG}
    command: [/config/frontend.jsonnet]
    expose:
      - "8980"   # gRPC — Envoy's upstream (intra-compose docker bridge)
    ports:
      # Same gRPC :8980 also bound on the Hetzner private interface so
      # that ondemand worker VMs can reach CAS/AC/FSAC directly without
      # hairpinning through the public Envoy listener (which now requires
      # TLS+JWT — see header port-strategy block and
      # worker/config/common.libsonnet for the full reasoning).
      - "${PRIVATE_IP}:8980:8980"
    volumes:
      - ./config:/config:ro
    depends_on:
      - storage-0
      - storage-1
      - scheduler

  # ---------------------------------------------------------------------
  # Scheduler — the work queue. Takes requests from the frontend on 8982,
  # dispatches them to workers on 8983 (workers connect via the private
  # network from ondemand VMs), serves the HTML admin UI on 7982 (public),
  # and exposes a programmatic BuildQueueState gRPC on 8984 that the
  # ondemand scaler daemon polls to decide when to spin VMs up/down.
  # ---------------------------------------------------------------------
  scheduler:
    <<: *bb-image-common
    image: ghcr.io/buildbarn/bb-scheduler:${BB_SCHEDULER_TAG}
    command: [/config/scheduler.jsonnet]
    expose:
      - "8982"   # Frontend → scheduler
    ports:
      - "7982:7982"
      - "${PRIVATE_IP}:8983:8983"
      - "127.0.0.1:8984:8984"
    volumes:
      - ./config:/config:ro
      # TLS material for the public admin UI on :7982. Files are kept on
      # the persistent BB volume and refreshed by certbot's deploy-hook;
      # bb-scheduler picks them up via tls.serverKeyPair.files.refreshInterval.
      - /var/lib/buildbarn/certs:/etc/buildbarn/certs:ro

  # ---------------------------------------------------------------------
  # Browser — human-facing web UI for inspecting actions, CAS blobs, and
  # queued/running operations. Read-only from the storage tier.
  # ---------------------------------------------------------------------
  browser:
    <<: *bb-image-common
    image: ghcr.io/buildbarn/bb-browser:${BB_BROWSER_TAG}
    command: [/config/browser.jsonnet]
    ports:
      - "7984:7984"
    volumes:
      - ./config:/config:ro
      # TLS material for the public web UI on :7984 — same source as
      # scheduler/envoy, hot-reloaded via refreshInterval.
      - /var/lib/buildbarn/certs:/etc/buildbarn/certs:ro
    depends_on:
      - storage-0
      - storage-1
      - scheduler

  # ---------------------------------------------------------------------
  # bb-portal — build observability UI: ingests Bazel's Build Event
  # Stream (BES) over gRPC, persists invocations/actions/targets in a
  # local Postgres, serves a Next.js UI proxied through the Go backend.
  # Adds the historical-build view that bb-scheduler-admin :7982 can't
  # provide (the scheduler's in-memory queue forgets operations 60 s
  # after the Bazel client disconnects). See buildbarn-portal-plan.md.
  #
  # Three containers, one logical service:
  #   bb-portal-db        — Percona Distribution for PostgreSQL 17.x
  #   bb-portal-backend   — Go process: HTTP UI :8081, BES gRPC :8082,
  #                          diagnostics :80; reverse-proxies non-API
  #                          HTTP requests to bb-portal-frontend.
  #   bb-portal-frontend  — Next.js UI on :3000, internal-only.
  #
  # Public surface (Phase 1, coexists with bb-browser :7984 / bb-
  # scheduler-admin :7982 — see plan §"Step 1 → Decision A"):
  #   :7986  HTTPS UI    (bb-portal-backend :8081 mapped to host)
  #   :1985  grpcs BES   (terminated by Envoy with TLS+jwt_authn,
  #                       see reapi-proxy/envoy.yaml)
  # ---------------------------------------------------------------------

  # PDP image — drop-in vanilla-PG-17 ABI with Percona's bundled
  # extensions on disk (none auto-loaded). UID 26 is the postgres user
  # baked into the image's `USER 26` line; we replicate it on the
  # `user:` field so the host bind-mount permissions match. PGDATA is
  # baked at /data/db (image default; see Dockerfile from
  # github.com/percona/percona-docker/percona-distribution-postgresql-17),
  # which is why the bind-mount target below is /data/db, not the
  # Debian-default /var/lib/postgresql/data.
  #
  # First-boot ownership requirement: /var/lib/buildbarn/portal-db must
  # be `chown -R 26:26` BEFORE the first `docker compose up`. handled
  # by create-central.sh's setup_persistent_dirs step (see the same
  # script for the matching mkdir for compose/secrets/).
  bb-portal-db:
    <<: *bb-image-common
    image: percona/percona-distribution-postgresql:${BB_PORTAL_PDP_TAG}
    container_name: bb-portal-db
    user: "26:26"
    environment:
      # Standard Docker-Postgres conventions; the PDP image's
      # entrypoint.sh accepts the same env-var contract as the
      # vanilla docker-library/postgres image (verified against
      # github.com/percona/percona-docker/percona-distribution-
      # postgresql-17/entrypoint.sh).
      - POSTGRES_USER=bbportal
      - POSTGRES_PASSWORD=${BB_PORTAL_DB_PASSWORD}
      - POSTGRES_DB=bbportal
    volumes:
      - /var/lib/buildbarn/portal-db:/data/db
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbportal -d bbportal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # bb-portal Go backend. Entrypoint is /app/bb_portal (set by
  # bb-storage's multiarch_go_image macro — same shape as bb-storage,
  # bb-scheduler, bb-browser images), takes a single positional arg
  # = jsonnet config path. We pass /config/bb-portal.jsonnet.
  #
  # Port roles (see bb-portal.jsonnet for the wiring):
  #   :8081  public HTTPS — terminates TLS itself (cert mounted from
  #          /var/lib/buildbarn/certs/), runs OIDC redirect against
  #          Dex (client_id=bb-portal). Mapped to host :7986.
  #   :8082  BES gRPC ingest — internal-only on the docker bridge;
  #          reached from outside via Envoy on :1985 which terminates
  #          TLS + validates JWT before forwarding.
  #   :80    diagnostics (Prometheus exporter, pprof) — exporter only,
  #          no scraper running today; available for ad-hoc curl from
  #          the host during incident response.
  bb-portal-backend:
    <<: *bb-image-common
    image: ghcr.io/buildbarn/bb-portal-backend:${BB_PORTAL_TAG}
    container_name: bb-portal-backend
    command: [/config/bb-portal.jsonnet]
    ports:
      # Public HTTPS UI. Host-side port :7986 chosen to extend the
      # :798x family (7982 scheduler admin, 7984 bb-browser, 7986
      # bb-portal). bb-portal-backend terminates TLS internally
      # (see common.serverTls in bb-portal.jsonnet's httpServers
      # entry) — the Let's Encrypt cert is shared via the volume
      # mount below.
      - "7986:8081"
    volumes:
      - ./config:/config:ro
      # Same Let's Encrypt cert / refresh story as bb-browser /
      # bb-scheduler / dex / envoy: certbot's deploy-hook copies
      # fullchain.pem + privkey.pem (mode 0644) into this dir on
      # every renewal and restarts the service so the new cert is
      # picked up without restart of the whole stack.
      - /var/lib/buildbarn/certs:/etc/buildbarn/certs:ro
    depends_on:
      bb-portal-db:
        # Postgres init takes ~5–15 s on first boot (initdb +
        # docker-entrypoint.d scripts). Without service_healthy
        # gating, bb-portal hits a "connection refused" pgx error,
        # crashes, and docker restart-loops it for ~30 s before the
        # next try lands. service_healthy + the pg_isready healthcheck
        # on bb-portal-db converts that thrash into a clean ordered
        # startup.
        condition: service_healthy
      dex:
        # OIDC discovery is fetched lazily (on the first
        # unauthenticated request, not at startup), so this is
        # `service_started` rather than `service_healthy` — bb-portal
        # boots even if Dex is briefly unhealthy and only fails the
        # FIRST login attempt rather than refusing to start. Matches
        # how envoy-proxy treats dex.
        condition: service_started

  # bb-portal Next.js frontend. Internal-only — bb-portal-backend
  # reverse-proxies every non-API HTTP request to it via
  # `frontendProxyUrl` in bb-portal.jsonnet. EXPOSE 3000 is set in
  # the upstream Dockerfile and we don't override.
  #
  # Configuration is purely env-var-based (no jsonnet, no config file)
  # — see github.com/buildbarn/bb-portal/README.md "Configuration"
  # section for the full list. We ship the minimal set:
  #   * NEXT_PUBLIC_BES_BACKEND_URL / NEXT_PUBLIC_BES_GRPC_BACKEND_URL
  #     point at the public UI/BES endpoints we expose, so deep-links
  #     in the UI render with the right hostname for an external
  #     operator.
  #   * NEXT_PUBLIC_COMPANY_NAME is the brand string in the UI header.
  #   * NEXT_PUBLIC_ENABLED_FEATURES_BEP_UPLOAD=false matches the
  #     server-side enableBepFileUpload=false in bb-portal.jsonnet —
  #     hides the upload button and stops the corresponding backend
  #     route. We do NOT want operators uploading stale .bep files
  #     from a developer laptop into our shared invocation history.
  #   * NEXT_PUBLIC_ENABLED_FEATURES_{BROWSER,SCHEDULER,OPERATIONS}
  #     are intentionally NOT overridden — the upstream image's baked-in
  #     frontend/.env defaults them to true, which is what we want now
  #     that Phase 2a has wired browserServiceConfiguration and
  #     schedulerServiceConfiguration in bb-portal.jsonnet. The /browser,
  #     /scheduler, and /operations routes render real content; their
  #     in-page gRPC-Web fetches reach frontend:8980 and scheduler:8984
  #     via the bb-portal-backend's grpc-web proxy and return real data.
  #     If you ever need to hide one of these views again (e.g. while
  #     debugging a regression in bb-portal's browser handler), flip
  #     the corresponding NEXT_PUBLIC_ENABLED_FEATURES_* to false here
  #     — the page body falls back to the upstream <PageDisabled/> stub
  #     and the AppBar entry disappears, without touching backend config.
  bb-portal-frontend:
    <<: *bb-image-common
    image: ghcr.io/buildbarn/bb-portal-frontend:${BB_PORTAL_TAG}
    container_name: bb-portal-frontend
    environment:
      - NEXT_PUBLIC_BES_BACKEND_URL=https://${PUBLIC_HOSTNAME}:7986
      - NEXT_PUBLIC_BES_GRPC_BACKEND_URL=grpcs://${PUBLIC_HOSTNAME}:1985
      - NEXT_PUBLIC_COMPANY_NAME=Percona PSMDB
      - NEXT_PUBLIC_ENABLED_FEATURES_BEP_UPLOAD=false
    expose:
      - "3000"

  # ---------------------------------------------------------------------
  # Dex — OIDC identity provider used as a thin bridge between
  # Buildbarn's web UIs and GitHub OAuth. We need it because GitHub's
  # OIDC user_info does NOT expose team membership; Dex performs the
  # extra `/teams/{slug}/memberships/{user}` calls and packs the
  # result into a single `groups` claim that bb-browser / bb-scheduler
  # can match with one JMESPath expression. See dex/dex.yaml header
  # and buildbarn-auth-tls-plan.md §2 for the full rationale.
  #
  # Step 3 of the auth plan: Dex stands up with the GitHub connector
  # and the bb-* static clients pre-declared. Step 4 wires bb-browser
  # / bb-scheduler to actually delegate login here.
  # ---------------------------------------------------------------------
  dex:
    <<: *bb-image-common
    image: ghcr.io/dexidp/dex:${DEX_IMAGE_TAG}
    command: ["dex", "serve", "/etc/dex/dex.yaml"]
    networks:
      # Network alias for the public hostname so that bb-browser and
      # bb-scheduler — which sit on the same docker-compose default
      # bridge network as dex — can resolve `bb.psmdb.percona.com` to
      # this container directly via docker's embedded DNS, without
      # hairpin-ing through the host's NAT.
      #
      # Why this matters: the OIDC config in browser.jsonnet /
      # scheduler.jsonnet uses the public issuer URL (https://
      # bb.psmdb.percona.com:5556) for BOTH the user-browser-facing
      # /auth redirect AND the server-to-server /token call from
      # BB. The user's browser resolves the hostname via public DNS
      # (No-IP → Hetzner Floating IP); the BB container resolves the
      # same hostname via docker DNS thanks to this alias and the
      # call stays inside the bridge. TLS validation succeeds in
      # both cases because the cert SAN matches the hostname in the
      # URL, regardless of which IP the connection lands on.
      #
      # Without this alias, BB → /token would have to NAT-loop
      # through the host's external interface (Hetzner allows this
      # in practice but it's an extra hop and a class of failure
      # we don't need).
      default:
        aliases:
          - bb.psmdb.percona.com
    ports:
      # Public TLS endpoint for OIDC clients. Cert SAN must match
      # bb.psmdb.percona.com or browsers / bb-* HTTP clients reject
      # token endpoint calls.
      - "5556:5556"
    volumes:
      # Dex config. Read-only — secrets come in via the environment
      # so the YAML stays committable to the public repo.
      - ./dex/dex.yaml:/etc/dex/dex.yaml:ro
      # Step 5e — vendored Dex 2.41.1 web/ tree with the customised
      # login template (connector whitelist) and Percona branding.
      # Path matches `frontend.dir` in dex.yaml. Read-only because Dex
      # only reads from it on startup; live edits require a container
      # restart anyway. See dex/dex.yaml § frontend: for the why.
      - ./dex/web:/etc/dex/web:ro
      # Same Let's Encrypt cert that envoy-proxy / browser /
      # scheduler use, served via Dex's `web.tlsCert/tlsKey`.
      - /var/lib/buildbarn/certs:/etc/buildbarn/certs:ro
      # SQLite storage on the persistent BB volume (chowned 1001:1001
      # by create-central.sh's bootstrap_dex_dir step). Holds
      # auth-codes, refresh tokens, signing-key history. Survives
      # `docker compose down` and `docker compose up -d` — losing
      # this file kicks every operator into a fresh GitHub login.
      - /var/lib/buildbarn/dex:/var/dex
    environment:
      # Substituted into dex.yaml at startup. Loaded from compose's
      # `.env` (mode 0600), populated by create-central.sh's bake_env.
      #
      # IMPORTANT: every staticClients[].secretEnv NAME in dex.yaml MUST
      # have a matching entry here. Dex resolves secretEnv via os.Getenv
      # at config-load time; a missing env var stores `""` as the
      # secret, and the next /token exchange fails with
      # `invalid_client / Invalid client credentials` — which is
      # exactly what bites Phase-1 portal users on first login.
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET}
      - BB_BROWSER_OIDC_SECRET=${BB_BROWSER_OIDC_SECRET}
      - BB_SCHED_OIDC_SECRET=${BB_SCHED_OIDC_SECRET}
      - BB_PORTAL_OIDC_SECRET=${BB_PORTAL_OIDC_SECRET}
      # Substituted via DEX_EXPAND_ENV into the github-actions connector's
      # `audiences:` list at dex.yaml load time. Operator-controlled
      # coordination string (`openssl rand -hex 16` once per buildfarm),
      # baked into .env by create-central.sh.
      - PSMDB_RBE_GHA_AUDIENCE=${PSMDB_RBE_GHA_AUDIENCE}
    healthcheck:
      # Dex exposes /healthz on the same port as the discovery
      # endpoint. We curl with --insecure because docker's healthcheck
      # runs from inside the same container that serves the cert —
      # no point cross-validating localhost.
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1:5556/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------
  # REAPI v2 capabilities shim — Bazel 7.x refuses to talk to BuildBarn
  # because BuildBarn advertises a newer REAPI minor version than Bazel
  # supports. This tiny Go proxy rewrites the ServerCapabilities response
  # to match what the client expects. Only Capabilities RPCs hit it —
  # everything else goes straight to the frontend (see envoy.yaml).
  # Source lives in IaC/buildbarn/reapi-proxy/ (shared with non-ondemand
  # deployments). The bootstrap script rsyncs those source files to
  # /var/lib/buildbarn/reapi-proxy/ and this `build:` context picks them
  # up relative to the compose file.
  # ---------------------------------------------------------------------
  reapi-proxy:
    <<: *bb-image-common
    build:
      context: /var/lib/buildbarn/reapi-proxy
      dockerfile: Dockerfile
    image: psmdb-reapi-proxy:local
    command: ["-listen", ":8990", "-backend", "frontend:8980"]
    expose:
      - "8990"
    depends_on:
      - frontend

  # ---------------------------------------------------------------------
  # Envoy — the gateway Bazel clients actually connect to. Routes
  # Capabilities RPCs to reapi-proxy (version patching) and every other
  # RPC straight to frontend. Listens on 8981 inside the container; this
  # is the only TLS termination point on the path — frontend and
  # reapi-proxy stay plaintext on the docker bridge. Step 5 added a
  # jwt_authn filter that validates `Authorization: Bearer <jwt>`
  # against Dex's /keys (issuer https://bb.psmdb.percona.com:5556,
  # audience bazel-cli); see envoy.yaml for the filter and the
  # `dex_jwks` upstream cluster.
  # ---------------------------------------------------------------------
  envoy-proxy:
    <<: *bb-image-common
    image: envoyproxy/envoy:${ENVOY_IMAGE_TAG}
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    # Run as root inside the container so Envoy can read the Let's Encrypt
    # privkey.pem (mode 600 root:root on the host volume). The container is
    # isolated; nothing on the host changes.
    user: "0:0"
    # PSMDB-2034: lift the soft fd-limit. The envoyproxy/envoy image
    # inherits Docker's default 1024 soft / 524288 hard, and on a busy
    # central (cpx62, 16 worker threads) the proxy hovers around ~750 fd
    # at idle and crosses 1024 the moment a 17-stage Jenkins matrix
    # bursts in synchronously. EMFILE on socket(2) surfaces in Bazel
    # client logs as:
    #   UNAVAILABLE: upstream connect error or disconnect/reset before
    #   headers. reset reason: local connection failure, transport
    #   failure reason: socket creation failure
    # which we observed multiple times in builds #12 and #13 of
    # hetzner-psmdb83-autobuild-RELEASE-RBE on the new cluster. Same
    # exhaustion also stalls accept(2) for incoming TLS, surfacing
    # client-side as SslHandshakeTimeoutException after 10s — i.e. one
    # root cause, two symptoms.
    #
    # 65535 soft is a standard headroom for high-concurrency proxies;
    # the kernel's per-process hard ceiling on this host is 524288 and
    # we keep that as the upper bound rather than touching nr_open.
    ulimits:
      nofile:
        soft: 65535
        hard: 524288
    ports:
      # Public TLS endpoint for Bazel clients. Cert is the Let's Encrypt
      # cert for bb.psmdb.percona.com (see envoy.yaml). Plain gRPC clients
      # (grpc://) will fail with "connection reset" — they must use
      # grpcs:// from now on.
      - "8981:8981"
      # bb-portal Build Event Stream (BES) ingest. Same TLS cert + same
      # JWT issuer/audience as :8981, terminated by the bes_grpc_listener
      # in envoy.yaml; forwarded plaintext to bb-portal-backend:8082.
      # Plan §"Step 1 → Decision B" — Envoy is the single auth boundary
      # for both Bazel-execution and BES traffic.
      - "1985:1985"
      # PSMDB-2034: Envoy admin endpoint on loopback only. The matching
      # `admin:` block in envoy.yaml binds 127.0.0.1:9901 inside the
      # container; we mirror that to the host's loopback so an SSH'd
      # operator can run `curl localhost:9901/clusters` to inspect
      # circuit-breaker counters (cx_overflow, rq_pending_overflow, …)
      # during a Bazel matrix run. Public bind would be a footgun — admin
      # has no auth and exposes /quitquitquit / /healthcheck/fail.
      - "127.0.0.1:9901:9901"
    volumes:
      - /var/lib/buildbarn/reapi-proxy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      # Cert dir maintained by the certbot deploy-hook (10-buildbarn.sh):
      # contains resolved fullchain.pem + privkey.pem (mode 0644) so the
      # files are readable inside the container regardless of any docker
      # userns-remap setup. The hook restarts this service on renewal.
      - /var/lib/buildbarn/certs:/etc/buildbarn/certs:ro
    depends_on:
      - reapi-proxy
      - frontend
      # dex must be up before envoy starts so the very first /keys
      # fetch on cold-start succeeds. Envoy's remote_jwks does retry
      # in the background, but a failed first fetch turns every Bazel
      # RPC into a 401 for ~1 cache_duration after recovery. Cheaper
      # to gate the start order.
      - dex
      # bb-portal-backend backs the new bes_grpc_listener on :1985.
      # Envoy starting before bb-portal-backend results in DNS-resolve
      # failures inside the bb_portal_bes cluster for the first
      # several seconds — Bazel clients sending early BES events
      # would see UNAVAILABLE. Cheap fix: gate startup order.
      - bb-portal-backend

  # ---------------------------------------------------------------------
  # Scaler — the control loop that spawns and reaps worker VMs based on
  # BuildQueueState. Built from IaC/buildbarn/ondemand/scaler/ in this repo
  # (rsync'd by create-central.sh to /var/lib/buildbarn/scaler). It needs:
  #
  #   * network_mode: host — to reach the scheduler's BuildQueueState at
  #     127.0.0.1:8984 (which is only bound to loopback on the host).
  #   * HCLOUD_TOKEN — Hetzner Cloud API token (from .env).
  #   * SCALER_DRY_RUN=true for initial cut — the scaler logs "would
  #     spawn / would delete" without touching Hetzner. Flip to false in
  #     .env once the decisions match operator expectations.
  #   * The worker/ tree mounted read-only so the scaler renders cloud-init
  #     from the same source spawn-worker.sh uses — no drift between the
  #     manual and automatic paths.
  # ---------------------------------------------------------------------
  scaler:
    <<: *bb-image-common
    build:
      context: /var/lib/buildbarn/scaler
      dockerfile: Dockerfile
    image: psmdb-bb-scaler:local
    network_mode: host
    # NET_ADMIN lets the scaler run `wg set wg0 …` on the HOST's WireGuard hub
    # (network_mode: host shares the host net namespace) to add/remove AWS
    # worker peers. No-op unless AWS fallback is enabled.
    cap_add:
      - NET_ADMIN
    environment:
      - HCLOUD_TOKEN=${HCLOUD_TOKEN}
      - SCALER_DRY_RUN=${SCALER_DRY_RUN:-true}
      - SPAWN_THROTTLE_PER_POOL=${SPAWN_THROTTLE_PER_POOL:-1}
      - POOLS_CONFIG=/config/ondemand-pools.yaml
      - WORKER_SRC=/worker
      - SCHEDULER_STATE_GRPC=127.0.0.1:8984
      # --- AWS Graviton fallback (inert unless aws.enabled in ondemand-pools.yaml) ---
      # Credentials: a narrow IAM-user access key (RunInstances/Terminate/
      # Describe, region+type+tag scoped — mirror the percona-server GHA
      # fallback policy). The scaler runs on Hetzner, so no instance profile.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_AMI_ID=${AWS_AMI_ID:-}
      - AWS_SUBNET_ID=${AWS_SUBNET_ID:-}
      - AWS_SECURITY_GROUP_IDS=${AWS_SECURITY_GROUP_IDS:-}
      - AWS_KEY_NAME=${AWS_KEY_NAME:-}
      # --- WireGuard hub (written by scripts/setup-wireguard-hub.sh) ---
      - WG_IFACE=${WG_IFACE:-wg0}
      - WG_HUB_PUBKEY=${WG_HUB_PUBKEY:-}
      - WG_HUB_ENDPOINT=${WG_HUB_ENDPOINT:-}
      - WG_ALLOWED_IPS=${WG_ALLOWED_IPS:-}
    volumes:
      - ./config:/config:ro
      - /var/lib/buildbarn/worker:/worker:ro
    depends_on:
      - scheduler
